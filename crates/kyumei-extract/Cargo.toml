[package]
name = "kyumei-extract"
description = "Generates Kyumei knowledge claims from Temporal source checkouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "gen-dc-claims"
path = "src/bin/gen-dc-claims.rs"

[[bin]]
name = "gen-metric-claims"
path = "src/bin/gen-metric-claims.rs"

[[bin]]
name = "gen-sdk-metric-claims"
path = "src/bin/gen-sdk-metric-claims.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tempdes.workspace = true
toml.workspace = true

[dev-dependencies]
kyumei-knowledge.workspace = true
tempfile = "3"

[lints]
workspace = true
