# ------------------------------------------------------------- conclusions
# The first conclusion whose condition holds is the diagnosis.

[[conclusion]]
id = "worker-rate-limit-under-fanout"
title = "Workers' Task Queue rate limit reached under an Activity fan-out"
statement = "Activity schedule-to-start rose because the rate limit the Workers set for the whole Task Queue ({dispatch_rate_limit.last}) held Activity Tasks back while a fan-out added them at up to {tasks_add_rate.max}. The excess waited in Matching's backlog, which reached {backlog_age.max} old. Activity slots stayed free throughout (at least {activity_slots_available.min}) and Activity Task polls effectively never failed: every Worker sends the same Task Queue-wide limit, so more Workers would not have raised it."
when = { all = [
  { hypothesis = "worker-rate-limit", state = ["established"] },
  { hypothesis = "activity-matching-backlog", state = ["established"] },
  { hypothesis = "activity-slot-exhaustion", state = ["eliminated"] },
  { hypothesis = "activity-poll-throttling", state = ["eliminated"] },
  { hypothesis = "activity-fanout", state = ["established"] },
] }

[[conclusion.clause]]
when = { ratio = { numerator = "tasks_dispatch_rate.max", denominator = "dispatch_rate_limit.last" }, op = "ge", value = 0.95 }
text = "Dispatch ran at {tasks_dispatch_rate.max}, pinned at the limit."

[[conclusion.clause]]
when = { signal = "rate_limiting_active", stat = "max", op = "ge", value = 1 }
text = "DescribeTaskQueue reported the rate limiter holding dispatch back in the 30 seconds before it was captured."

[[conclusion.clause]]
when = { all = [
  { signal = "rate_limiting_active", stat = "max", op = "ge", value = 1 },
  { ratio = { numerator = "tasks_dispatch_rate.max", denominator = "dispatch_rate_limit.last" }, op = "lt", value = 0.95 },
] }
text = "Dispatch ran at {tasks_dispatch_rate.max}, below the limit: each read partition enforces its share of it, so partitions that receive fewer tasks leave part of the limit unused."

[[conclusion.clause]]
when = { signal = "scheduled_activities_rate", stat = "max", op = "ge", value = 1 }
text = "Workflows scheduled Activities at up to {scheduled_activities_rate.max}, from about {scheduled_activities_rate.baseline} before the incident."

[[conclusion.recommendation]]
text = "The Workers' Activity rate option limits the whole Task Queue, not each Worker: TaskQueueActivitiesPerSecond in Go, setMaxTaskQueueActivitiesPerSecond in Java, max_task_queue_activities_per_second in Core-based SDKs. If a per-Worker limit was intended, use the per-Worker option instead (WorkerActivitiesPerSecond in Go, setMaxWorkerActivitiesPerSecond in Java) and raise or remove the Task Queue limit."
caution = "Change the option on every Worker polling the Task Queue: Workers with different values overwrite each other's, and the latest poll wins."
claims = ["sdk.task-queue-activities-per-second", "limit.activity-worker-rate"]

[[conclusion.recommendation]]
text = "If the limit protects a downstream dependency, keep it and pace the Workflows that fan out Activities, so the add rate stays below the limit ({dispatch_rate_limit.last})."
claims = ["behaviour.schedule-activity-adds-task", "heuristic.activity-fanout"]

[[conclusion.recommendation]]
text = "Do not add Workers or Activity slots for this symptom: execution capacity was available throughout."
claims = ["heuristic.slots-headroom"]

