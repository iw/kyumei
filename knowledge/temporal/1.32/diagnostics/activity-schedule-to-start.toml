# Diagnostic: elevated Activity schedule-to-start latency.
#
# The investigation follows an Activity Task's path: Worker execution
# capacity, Activity polling, poll failures and throttling, Matching's
# backlog and dispatch, which rate limit caps dispatch, then upstream load.
# Activity Task Queues can carry a rate limit set by the Workers themselves,
# for the whole Task Queue, so "the Workers are idle" is not evidence that
# more Workers would help.

[diagnostic]
id = "activity-schedule-to-start"
title = "Elevated Activity schedule-to-start latency"
summary = "Activity Tasks wait a long time between being scheduled and being started by a Worker."
# Ahead of the Workflow Task diagnostic, whose patterns also match "schedule-to-start".
precedence = 5

[diagnostic.path]
description = "The path an Activity Task takes: scheduled by a Workflow, added to Matching by History, and dispatched to the Activity Workers."
layers = ["clients", "frontend", "history", "matching", "workers"]
labels = { clients = "Workflows scheduling Activities" }

[[symptom]]
id = "activity-schedule-to-start-elevated"
title = "Activity schedule-to-start latency is elevated"
patterns = [
  "activit(y|ies)\\b.{0,40}schedule[- ]?to[- ]?start",
  "schedule[- ]?to[- ]?start.{0,40}\\bactivit(y|ies)",
  "activit(y|ies)( tasks?)?\\b.{0,80}\\b(wait|waiting|delayed|slow|queued|backlog|taking|pil(e|ing) up)",
  "activit(y|ies)( tasks?)?\\b.{0,80}\\b(takes?|took)\\b.{0,40}\\bto (start|be picked up|get picked up)",
  "activit(y|ies)( tasks?)?\\b.{0,80}\\b(start(s|ing|ed)? late|late to start)",
]
signal = "activity_schedule_to_start"

# ------------------------------------------------------------------ stages

[[stage]]
id = "activity-capacity"
order = 1
title = "Worker execution capacity"
question = "Are Workers out of Activity slots?"

[[stage]]
id = "activity-pollers"
order = 2
title = "Activity Task polling"
question = "Are enough Activity Task polls outstanding?"

[[stage]]
id = "poll-throttling"
order = 3
title = "Poll failures and throttling"
question = "Are Activity Task polls failing or being throttled?"

[[stage]]
id = "matching-backlog"
order = 4
title = "Matching backlog and dispatch"
question = "Are Activity Tasks waiting in Matching?"

[[stage]]
id = "rate-limit"
order = 5
title = "Task Queue rate limit"
question = "Which rate limit caps Activity dispatch?"

[[stage]]
id = "upstream"
order = 6
title = "Upstream load"
question = "What is driving the Activity Task add rate?"

# ----------------------------------------------------------------- signals

[[signal]]
id = "activity_schedule_to_start"
title = "Activity schedule-to-start latency"
unit = "seconds"
description = "Time from an Activity Task being scheduled to a Worker starting it (a high quantile over the window)."
source = [{ claim = "sdk.activity_schedule_to_start_latency" }]

[[signal]]
id = "activity_slots_available"
title = "Free Activity slots (all Workers)"
unit = "count"
description = "Activity execution slots free across the Workers polling the Task Queue."
combine = "sum"
source = [{ claim = "sdk.worker_task_slots_available", labels = { worker_type = "ActivityWorker" } }]

[[signal]]
id = "activity_pollers"
title = "Activity Task pollers"
unit = "count"
description = "Activity Task pollers on the Task Queue, across Workers."
combine = "sum"
source = [{ claim = "sdk.num_pollers", labels = { poller_type = "activity_task" } }]

[[signal]]
id = "activity_poll_failures_rate"
title = "Failed Activity Task polls (SDK)"
unit = "per_second"
description = "PollActivityTaskQueue attempts that failed, as seen by the Workers."
combine = "sum"
source = [{ claim = "sdk.long_request_failure", labels = { operation = "PollActivityTaskQueue" }, transform = "rate" }]

[[signal]]
id = "activity_poll_rejections_rate"
title = "Rejected Activity Task polls (Frontend)"
unit = "per_second"
description = "PollActivityTaskQueue calls the Frontend rejected with ResourceExhausted."
combine = "sum"
source = [{ claim = "server.service_errors_resource_exhausted", labels = { operation = "PollActivityTaskQueue" }, transform = "rate" }]

[[signal]]
id = "backlog_count"
title = "Matching backlog (tasks)"
unit = "count"
description = "Activity Tasks waiting in the Task Queue's backlog in Matching."
combine = "sum"
source = [
  { claim = "api.task_queue_stats.approximate_backlog_count" },
  { claim = "server.approximate_backlog_count", labels = { task_type = "Activity" } },
]

[[signal]]
id = "backlog_age"
title = "Matching backlog age"
unit = "seconds"
description = "Age of the oldest Activity Task waiting in Matching's backlog."
source = [
  { claim = "api.task_queue_stats.approximate_backlog_age" },
  { claim = "server.approximate_backlog_age_seconds", labels = { task_type = "Activity" } },
]

[[signal]]
id = "tasks_add_rate"
title = "Activity Task add rate"
unit = "per_second"
description = "Activity Tasks added to the Task Queue per second (30-second average)."
source = [{ claim = "api.task_queue_stats.tasks_add_rate" }]

[[signal]]
id = "tasks_dispatch_rate"
title = "Activity Task dispatch rate"
unit = "per_second"
description = "Activity Tasks dispatched to Workers per second (30-second average)."
source = [{ claim = "api.task_queue_stats.tasks_dispatch_rate" }]

[[signal]]
id = "dispatch_rate_limit"
title = "Effective dispatch rate limit"
unit = "per_second"
description = "The Activity Task Queue's effective dispatch rate limit reported by DescribeTaskQueue."
source = [{ claim = "api.describe_task_queue.effective_rate_limit" }]

[[signal]]
id = "rate_limit_source"
title = "Source of the dispatch rate limit"
unit = "count"
description = "Where the effective rate limit comes from: the API, the Workers or the system default."
source = [{ claim = "api.describe_task_queue.rate_limit_source" }]

[[signal]]
id = "rate_limiting_active"
title = "Rate limiting holding dispatch back"
unit = "flag"
description = "Whether DescribeTaskQueue reported rate limiting active: within about 30 seconds before it was captured, Matching's rate limiter held back Activity Tasks it could otherwise have dispatched, on any partition."
source = [{ claim = "api.task_queue_stats.rate_limiting_active" }]

[[signal]]
id = "scheduled_activities_rate"
title = "Activities scheduled by Workflows"
unit = "per_second"
description = "ScheduleActivityTask commands per second in completed Workflow Tasks, across the namespace."
combine = "sum"
source = [{ claim = "server.command", labels = { commandType = "ScheduleActivityTask" }, transform = "rate" }]

# -------------------------------------------------------------- hypotheses

[[hypothesis]]
id = "activity-slot-exhaustion"
stage = "activity-capacity"
primary = true
layer = "workers"
title = "Activity Worker slots exhausted"
question = "Activity execution capacity exhausted?"
statement = "Every Activity Worker has used all of its Activity slots, so Workers stop polling and tasks wait until a slot frees."
implication = "Add Workers or Activity slots, or shorten Activity execution."

[[hypothesis]]
id = "activity-poller-starvation"
stage = "activity-pollers"
primary = true
layer = "workers"
title = "Activity Task poller starvation"
question = "Poll rate the bottleneck?"
statement = "Workers keep too few Activity Task polls outstanding: tasks wait in Matching for the next poll even though execution slots are free."
implication = "Raise the number of Activity Task pollers per Worker."

[[hypothesis]]
id = "activity-pollers-absent"
stage = "activity-pollers"
layer = "workers"
title = "No Activity Task pollers"
question = "Any Worker polling for Activities?"
statement = "No Worker is polling the Task Queue for Activity Tasks: Activity Workers are down, disconnected, or polling a different Task Queue name."

[[hypothesis]]
id = "activity-poll-throttling"
stage = "poll-throttling"
primary = true
layer = "frontend"
title = "Activity Task polls throttled or failing"
question = "Polls rejected or failing?"
statement = "PollActivityTaskQueue calls fail or are rejected (for example ResourceExhausted from a namespace or host rate limit), so pollers back off while execution slots stay free."

[[hypothesis]]
id = "activity-matching-backlog"
stage = "matching-backlog"
primary = true
layer = "matching"
title = "Activity Tasks accumulating in Matching"
question = "Latency accruing in Matching's backlog?"
statement = "Activity Tasks reach Matching promptly but wait in its backlog because Matching dispatches them more slowly than they are added."

[[hypothesis]]
id = "activity-history-delay"
stage = "matching-backlog"
layer = "history"
title = "Activity Tasks reaching Matching late"
question = "Latency accruing before Matching?"
statement = "The delay accrues between History scheduling the Activity and Matching receiving its task, so Matching's backlog does not account for the schedule-to-start latency."

[[hypothesis]]
id = "dispatch-rate-limited"
stage = "rate-limit"
primary = true
layer = "matching"
title = "Activity dispatch pinned at the Task Queue's rate limit"
question = "Dispatch pinned at the rate limit?"
statement = "Matching dispatches Activity Tasks at the Task Queue's effective rate limit while tasks are added faster, so the backlog grows whatever the Worker capacity."
implication = "Find which limit is in force: one set by the Workers, one set through the API, or the system default."

[[hypothesis]]
id = "worker-rate-limit"
stage = "rate-limit"
layer = "matching"
title = "Rate limit set by the Workers for the whole Task Queue"
question = "Limit set by the Workers?"
statement = "The Workers' Task Queue-wide Activity rate option (TaskQueueActivitiesPerSecond in Go) is the effective limit. Matching applies it to the whole Task Queue, not to each Worker, so adding Workers does not raise it."
implication = "Raise or remove the Workers' Task Queue rate, or use the per-Worker option if a per-Worker limit was intended."
activation = { hypothesis = "dispatch-rate-limited", state = ["established"] }

[[hypothesis]]
id = "api-rate-limit"
stage = "rate-limit"
layer = "matching"
title = "Rate limit set through the API"
question = "Limit set through the API?"
statement = "A queue rate limit set with UpdateTaskQueueConfig is the effective limit, overriding any rate the Workers send."
implication = "Review the queue rate limit set through the API."
activation = { hypothesis = "dispatch-rate-limited", state = ["established"] }

[[hypothesis]]
id = "system-rate-limit"
stage = "rate-limit"
layer = "matching"
title = "System default dispatch limit reached"
question = "System default limit binding?"
statement = "No API or Worker limit is below the system default, so Matching's per-partition default (1,000 tasks/s by default) times the read partitions caps dispatch."
implication = "Raise the partition count or the per-partition dispatch rate."
activation = { hypothesis = "dispatch-rate-limited", state = ["established"] }

[[hypothesis]]
id = "activity-fanout"
stage = "upstream"
primary = true
layer = "clients"
title = "Activity fan-out driving the add rate"
question = "Fan-out driving the add rate?"
statement = "Workflows scheduled far more Activities than before the incident, raising the Activity Task add rate."

# ---------------------------------------------------------------- requests
# Collection bodies may use {namespace}, {task_queue}, {start}, {end}, {step}.

[[request]]
id = "activity-worker-slots"
stage = "activity-capacity"
title = "Free Activity slots across Workers"
why = "A Worker only polls for an Activity when it can reserve a free Activity slot, so if every Worker had used all its slots, tasks would wait — the one cause more Workers would fix. This single query confirms or rules that out."
signals = ["activity_slots_available"]
distinguishes = ["activity-slot-exhaustion"]
cost = 1
group_by = ["task_queue"]
window = { pad_before_minutes = 10, pad_after_minutes = 5 }

[[request.collect]]
method = "promql"
label = "Free Activity slots, summed across Workers (range query, step {step})"
body = "sum by (task_queue) (temporal_worker_task_slots_available{worker_type=\"ActivityWorker\", namespace=\"{namespace}\", task_queue=\"{task_queue}\"})"
unit = "count"
claims = ["sdk.worker_task_slots_available", "sdk.activity-poll-needs-slot"]
note = "every SDK exports this gauge under this name; the Java SDK only when its slot supplier has a maximum"

[[request]]
id = "activity-schedule-to-start"
stage = "activity-capacity"
title = "Activity schedule-to-start latency"
why = "The symptom's magnitude is so far the operator's estimate. Measuring it lets every later comparison rest on telemetry."
signals = ["activity_schedule_to_start"]
distinguishes = ["activity-slot-exhaustion"]
cost = 1
group_by = ["task_queue"]

[[request.collect]]
method = "promql"
label = "p95 Activity schedule-to-start (Core-based SDKs: milliseconds by default)"
sdk_family = "core"
body = "histogram_quantile(0.95, sum by (le) (rate(temporal_activity_schedule_to_start_latency_bucket{namespace=\"{namespace}\", task_queue=\"{task_queue}\"}[1m])))"
unit = "milliseconds"
claims = ["sdk.activity_schedule_to_start_latency", "sdk.core-duration-unit"]

[[request.collect]]
method = "promql"
label = "p95 Activity schedule-to-start (Go SDK: seconds)"
sdk_family = "go"
body = "histogram_quantile(0.95, sum by (le) (rate(temporal_activity_schedule_to_start_latency_bucket{namespace=\"{namespace}\", task_queue=\"{task_queue}\"}[1m])))"
unit = "seconds"
claims = ["sdk.activity_schedule_to_start_latency", "sdk.go-metrics-naming"]
note = "with the OpenTelemetry handler, or tally's NewPrometheusNamingScope, the series is temporal_activity_schedule_to_start_latency_seconds_bucket"

[[request.collect]]
method = "promql"
label = "p95 Activity schedule-to-start (Java SDK with Micrometer: seconds)"
sdk_family = "java"
body = "histogram_quantile(0.95, sum by (le) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket{namespace=\"{namespace}\", task_queue=\"{task_queue}\"}[1m])))"
unit = "seconds"
claims = ["sdk.activity_schedule_to_start_latency", "sdk.java-metrics-naming"]

[[request]]
id = "activity-pollers"
stage = "activity-pollers"
title = "Activity Task pollers"
why = "The next question is whether Workers kept polls outstanding. The poller count shows whether any Worker was polling, and, against the dispatch rate, whether pollers were saturated or waiting for work."
signals = ["activity_pollers"]
distinguishes = ["activity-pollers-absent", "activity-poller-starvation"]
cost = 1
group_by = ["task_queue"]

[[request.collect]]
method = "promql"
label = "Activity Task pollers, summed across Workers"
body = "sum(temporal_num_pollers{poller_type=\"activity_task\", namespace=\"{namespace}\", task_queue=\"{task_queue}\"})"
unit = "count"
claims = ["sdk.num_pollers"]

[[request]]
id = "activity-poll-failures"
stage = "poll-throttling"
title = "Failed Activity Task polls"
why = "Polls rejected by a Frontend rate limit make Workers back off while slots stay free. Poll failures seen by the Workers show whether that happened."
signals = ["activity_poll_failures_rate"]
distinguishes = ["activity-poll-throttling"]
cost = 1
group_by = ["status_code"]

[[request.collect]]
method = "promql"
label = "Failed PollActivityTaskQueue attempts per second, by status code"
sdk_family = "core"
body = "sum by (status_code) (rate(temporal_long_request_failure{operation=\"PollActivityTaskQueue\", namespace=\"{namespace}\", task_queue=\"{task_queue}\"}[1m]))"
absent_reads_zero = { witness = 'sum(rate(temporal_long_request{operation="PollActivityTaskQueue", namespace="{namespace}", task_queue="{task_queue}"}[1m]))', because = "sdk.long-poll-failures-counted-on-failure" }
unit = "per_second"
claims = ["sdk.long_request_failure", "sdk.long-poll-failures-counted-on-failure"]

[[request.collect]]
method = "promql"
label = "Failed PollActivityTaskQueue attempts per second, by status code"
sdk_family = "go"
body = "sum by (status_code) (rate(temporal_long_request_failure{operation=\"PollActivityTaskQueue\", namespace=\"{namespace}\"}[1m]))"
absent_reads_zero = { witness = 'sum(rate(temporal_long_request{operation="PollActivityTaskQueue", namespace="{namespace}"}[1m]))', because = "sdk.long-poll-failures-counted-on-failure" }
unit = "per_second"
claims = ["sdk.long_request_failure", "sdk.long-poll-failures-counted-on-failure"]
note = "covers every Task Queue in the Namespace: the Go SDK labels its long polls task_queue=\"none\""

[[request.collect]]
method = "promql"
label = "Failed PollActivityTaskQueue attempts per second, by status code"
sdk_family = "java"
body = "sum by (status_code) (rate(temporal_long_request_failure_total{operation=\"PollActivityTaskQueue\", namespace=\"{namespace}\", task_queue=\"{task_queue}\"}[1m]))"
absent_reads_zero = { witness = 'sum(rate(temporal_long_request_total{operation="PollActivityTaskQueue", namespace="{namespace}", task_queue="{task_queue}"}[1m]))', because = "sdk.long-poll-failures-counted-on-failure" }
unit = "per_second"
claims = ["sdk.long_request_failure", "sdk.java-metrics-naming", "sdk.long-poll-failures-counted-on-failure"]

[[request]]
id = "activity-poll-rejections"
stage = "poll-throttling"
title = "Activity Task polls rejected by the Frontend"
why = "The Frontend's own count of rejected polls, by cause, confirms or rules out rate-limit throttling of polls."
signals = ["activity_poll_rejections_rate"]
distinguishes = ["activity-poll-throttling"]
cost = 2
requires = ["server-metrics"]
group_by = ["resource_exhausted_cause", "resource_exhausted_scope"]

[[request.collect]]
method = "promql"
label = "PollActivityTaskQueue calls rejected with ResourceExhausted, per second"
body = "sum by (resource_exhausted_cause, resource_exhausted_scope) (rate(service_errors_resource_exhausted{service_name=\"frontend\", operation=\"PollActivityTaskQueue\", namespace=\"{namespace}\"}[1m]))"
absent_reads_zero = { witness = 'sum(rate(service_requests{service_name="frontend", operation="PollActivityTaskQueue", namespace="{namespace}"}[1m]))', because = "server.request-errors-counted-on-error" }
unit = "per_second"
claims = ["server.service_errors_resource_exhausted", "server.request-errors-counted-on-error"]

[[request]]
id = "activity-queue-stats"
stage = "matching-backlog"
title = "Activity Task Queue backlog, rates and rate limit"
why = "With Worker capacity free and polls not throttled, the question is where the wait accrues. DescribeTaskQueue for the Activity Task Queue reports Matching's backlog, the add and dispatch rates, the effective rate limit, where that limit comes from, and whether the rate limiter held dispatch back in the last 30 seconds."
signals = ["backlog_age", "backlog_count", "tasks_add_rate", "tasks_dispatch_rate", "dispatch_rate_limit", "rate_limit_source", "rate_limiting_active"]
distinguishes = ["activity-matching-backlog", "activity-history-delay", "dispatch-rate-limited", "worker-rate-limit", "api-rate-limit", "system-rate-limit", "activity-poller-starvation"]
cost = 2
window = { pad_before_minutes = 0, pad_after_minutes = 0, guidance = "Capture it while the latency is elevated, and note the time." }

[[request.collect]]
method = "temporal-api"
label = "DescribeTaskQueue for the Activity Task Queue, with statistics, through grpcurl, captured during the incident"
body = '''grpcurl -plaintext -emit-defaults -d '{"namespace": "{namespace}", "taskQueue": {"name": "{task_queue}"}, "taskQueueType": "TASK_QUEUE_TYPE_ACTIVITY", "reportStats": true}' <frontend-host:7233> temporal.api.workflowservice.v1.WorkflowService/DescribeTaskQueue'''
claims = ["behaviour.frontend-grpc-reflection", "behaviour.describe-task-queue-rate-limit", "api.task_queue_stats.approximate_backlog_age", "api.task_queue_stats.tasks_add_rate", "api.task_queue_stats.tasks_dispatch_rate", "api.describe_task_queue.effective_rate_limit", "api.describe_task_queue.rate_limit_source", "api.task_queue_stats.rate_limiting_active"]
note = "point it at a Frontend, which answers gRPC reflection, so grpcurl needs no proto files; -emit-defaults keeps zero rates and a false rateLimitingActive, which protobuf JSON leaves out; with TLS, use -cacert, -cert and -key instead of -plaintext; record when you captured it"

[[request.collect]]
method = "temporal-cli"
label = "If you cannot run grpcurl: the Temporal CLI's description, as JSON, without the rate limit"
body = "temporal task-queue describe --namespace {namespace} --task-queue {task_queue} --task-queue-type activity -o json"
claims = ["cli.task-queue-describe", "api.task_queue_stats.approximate_backlog_age", "api.task_queue_stats.tasks_add_rate", "api.task_queue_stats.tasks_dispatch_rate"]
note = "CLI 1.7.0 to 1.9.1 print the backlog and rates but not the effective rate limit, its source or rateLimitingActive, and describe only the unversioned queue, or the default Build ID's, so with versioned Workers use grpcurl; keep --task-queue-type activity, or the Workflow Task Queue's rows come too; record when you captured it"

[[request.collect]]
method = "promql"
label = "If you can run neither: Matching's Activity backlog age over the window"
body = "max(approximate_backlog_age_seconds{namespace=\"{namespace}\", taskqueue=\"{task_queue}\", task_type=\"Activity\"})"
unit = "seconds"
claims = ["server.approximate_backlog_age_seconds", "server.taskqueue-tag"]

[[request]]
id = "scheduled-activities"
stage = "upstream"
title = "Activities scheduled by Workflows, before and during the incident"
why = "Each Activity a Workflow schedules adds one Activity Task. Comparing the rate of ScheduleActivityTask commands before and during the incident with the Task Queue's add rate shows whether a fan-out drove it."
signals = ["scheduled_activities_rate"]
distinguishes = ["activity-fanout"]
cost = 2
requires = ["server-metrics"]
window = { pad_before_minutes = 20, pad_after_minutes = 5 }

[[request.collect]]
method = "promql"
label = "ScheduleActivityTask commands per second in the namespace (include at least 10 minutes before the incident)"
body = "sum(rate(command{commandType=\"ScheduleActivityTask\", namespace=\"{namespace}\"}[1m]))"
unit = "per_second"
claims = ["server.command", "server.metrics-framework", "behaviour.schedule-activity-adds-task"]
note = "with the OpenTelemetry metrics framework the counter is named command_total"

# ------------------------------------------------------------------- rules

[[rule]]
id = "slots-headroom"
hypothesis = "activity-slot-exhaustion"
effect = "eliminates"
statement = "Activity execution capacity was not exhausted: at least {activity_slots_available.min} Activity slots stayed free across the Workers throughout the window while schedule-to-start reached {activity_schedule_to_start.max}."
claims = ["heuristic.sustained-needs-samples", "heuristic.slots-headroom", "heuristic.sts-elevated", "sdk.activity-poll-needs-slot"]
when = { all = [
  { signal = "activity_slots_available", stat = "min", op = "ge", value = 5 },
  { signal = "activity_slots_available", stat = "samples", op = "ge", value = 3 },
  { signal = "activity_schedule_to_start", stat = "max", op = "ge", value = 5 },
] }

[[rule]]
id = "slots-ran-out"
hypothesis = "activity-slot-exhaustion"
effect = "supports"
statement = "At times no Activity slot was free across the Workers (minimum {activity_slots_available.min})."
claims = ["heuristic.slots-headroom"]
when = { signal = "activity_slots_available", stat = "min", op = "lt", value = 1 }

[[rule]]
id = "slots-exhausted"
hypothesis = "activity-slot-exhaustion"
effect = "establishes"
statement = "Free Activity slots across the Workers averaged {activity_slots_available.mean} and never rose above {activity_slots_available.max} while schedule-to-start reached {activity_schedule_to_start.max}: Workers could poll for more Activities only as running ones finished."
claims = ["heuristic.sustained-needs-samples", "heuristic.slots-exhausted", "sdk.activity-poll-needs-slot", "heuristic.sts-elevated"]
when = { all = [
  { signal = "activity_slots_available", stat = "mean", op = "lt", value = 1 },
  { signal = "activity_slots_available", stat = "max", op = "lt", value = 5 },
  { signal = "activity_slots_available", stat = "samples", op = "ge", value = 3 },
  { signal = "activity_schedule_to_start", stat = "max", op = "ge", value = 5 },
] }

[[rule]]
id = "pollers-present"
hypothesis = "activity-pollers-absent"
effect = "eliminates"
statement = "Workers kept at least {activity_pollers.min} Activity Task pollers throughout the window."
when = { signal = "activity_pollers", stat = "min", op = "ge", value = 1 }

[[rule]]
id = "no-pollers"
hypothesis = "activity-pollers-absent"
effect = "establishes"
statement = "No Activity Task poller was active at any sample (maximum {activity_pollers.max}), and the Workers were not out of slots, which would also have stopped their polls."
claims = ["heuristic.sustained-needs-samples", "sdk.activity-poll-needs-slot"]
when = { all = [
  { signal = "activity_pollers", stat = "max", op = "lt", value = 1 },
  { signal = "activity_pollers", stat = "samples", op = "ge", value = 3 },
  { not = { hypothesis = "activity-slot-exhaustion", state = ["established", "supported"] } },
] }

[[rule]]
id = "pollers-busy"
hypothesis = "activity-poller-starvation"
effect = "supports"
statement = "Pollers were rarely idle: Matching dispatched {tasks_dispatch_rate.max} Activity Tasks to only {activity_pollers.mean} pollers, more than 50 per poller per second."
claims = ["heuristic.poller-busy"]
when = { all = [
  { signal = "activity_pollers", stat = "min", op = "ge", value = 1 },
  { ratio = { numerator = "tasks_dispatch_rate.max", denominator = "activity_pollers.mean" }, op = "ge", value = 50 },
] }

[[rule]]
id = "pollers-waiting"
hypothesis = "activity-poller-starvation"
effect = "weakens"
statement = "Pollers were mostly waiting for work: Matching dispatched {tasks_dispatch_rate.max} Activity Tasks across {activity_pollers.mean} pollers, fewer than 10 per poller per second."
claims = ["heuristic.poller-busy"]
when = { all = [
  { signal = "activity_pollers", stat = "min", op = "ge", value = 1 },
  { ratio = { numerator = "tasks_dispatch_rate.max", denominator = "activity_pollers.mean" }, op = "le", value = 10 },
] }

[[rule]]
id = "dispatch-capped-not-pollers"
hypothesis = "activity-poller-starvation"
effect = "eliminates"
statement = "Pollers were not the binding constraint: dispatch ran at {tasks_dispatch_rate.max}, pinned at the Task Queue's effective rate limit of {dispatch_rate_limit.last}, while tasks were added at {tasks_add_rate.max}."
claims = ["heuristic.dispatch-at-limit"]
