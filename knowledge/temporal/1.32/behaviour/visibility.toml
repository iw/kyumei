[[statement]]
id = "behaviour.visibility-task-dlq"
category = "behaviour"
title = "Failing visibility writes are retried for about an hour, then moved to the DLQ"
statement = "A visibility task whose write fails with an unexpected error, such as the store being unavailable, rejecting the write or timing out, is counted in task_errors and logged, at Warn as \"Fail to process task\" and, once the task has failed 30 times, at Error as \"Critical error processing task, retrying.\". It is retried, after its tenth attempt with a backoff that grows by a tenth each attempt, to at most 3 minutes. After history.TaskDLQUnexpectedErrorAttempts (70) such failures, about an hour, History moves the task to the History task DLQ when history.TaskDLQEnabled is on (the default), counting it in dlq_writes with task_category visibility. Its record is then not written until the DLQ is merged back, with tdbg dlq merge and DLQ type 4. Refusals by a limit (ResourceExhausted) do not count toward the 70."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
