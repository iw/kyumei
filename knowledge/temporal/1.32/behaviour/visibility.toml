[[statement]]
id = "behaviour.visibility-slow-query-log"
category = "behaviour"
title = "Slow visibility queries are logged"
statement = "When a visibility read takes longer than system.visibilityPersistenceSlowQueryThreshold (1 second), the host that made the call logs it at Warn, with the operation, its namespace and how long it took: \"List query exceeded threshold\" for listing Workflow Executions and \"Count query exceeded threshold\" for counting them, both with the query, and \"Get query exceeded threshold\" for getting one record."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/visibility/visiblity_manager_metrics.go", line = 130, excerpt = "if elapsed > m.slowQueryThreshold() {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/visibility/visiblity_manager_metrics.go", line = 131, excerpt = "m.logger.Warn(\"List query exceeded threshold\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/visibility/visiblity_manager_metrics.go", line = 134, excerpt = "tag.String(\"visibility-query\", request.Query)," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 56, excerpt = "\"system.visibilityPersistenceSlowQueryThreshold\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 57, excerpt = "time.Second," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/visibility/visiblity_manager_metrics.go", line = 171, excerpt = 'm.logger.Warn("Count query exceeded threshold",' },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/visibility/visiblity_manager_metrics.go", line = 174, excerpt = 'tag.String("visibility-query", request.Query),' },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/visibility/visiblity_manager_metrics.go", line = 211, excerpt = 'm.logger.Warn("Get query exceeded threshold",' },
]

[[statement]]
id = "behaviour.visibility-api-rejections"
category = "behaviour"
title = "Listing calls over the visibility limit are rejected at once"
statement = "A listing or counting call over the namespace's visibility limit on a Frontend host (limit.frontend-visibility-rps) fails at once with ResourceExhausted, cause RpsLimit and scope Namespace, message \"namespace rate limit exceeded\". The Frontend counts it in service_errors_resource_exhausted, with the API as its operation, such as ListWorkflowExecutions or CountWorkflowExecutions."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/configs/quotas.go", line = 290, excerpt = "mapping[api] = visibilityRateLimiter" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 92, excerpt = "if err := ni.Allow(ns, method, headers.NewGRPCHeaderGetter(ctx)); err != nil {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 156, excerpt = "return ErrNamespaceRateLimitServerBusy" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 26, excerpt = "Cause:   enumspb.RESOURCE_EXHAUSTED_CAUSE_RPS_LIMIT," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 27, excerpt = "Scope:   enumspb.RESOURCE_EXHAUSTED_SCOPE_NAMESPACE," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 28, excerpt = "Message: \"namespace rate limit exceeded\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 303, excerpt = "telemetryInterceptor.UnaryIntercept," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 307, excerpt = "namespaceRateLimiterInterceptor.Intercept," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 104, excerpt = "metrics.ServiceErrResourceExhaustedCounter.With(metricsHandler).Record(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/telemetry.go", line = 380, excerpt = "return baseMetricsHandler.WithTags(metrics.OperationTag(overridedMethodName), metrics.NamespaceTag(nsName.String()))," },
]
