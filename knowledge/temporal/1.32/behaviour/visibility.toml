# How Temporal Server 1.32 keeps the visibility store up to date (the
# records that listing, counting and searching Workflow Executions read),
# how it limits calls to the store, and what happens when the store is slow
# or failing.

[[statement]]
id = "behaviour.visibility-write-path"
category = "behaviour"
title = "History writes visibility records through a queue of its own"
statement = "A Workflow Execution's visibility record, which listing, counting and searching read, is not written with the change itself. Starting the Workflow, upserting its search attributes or memo, and closing it each add a visibility task to the shard's visibility queue. The queue's tasks run on a scheduler of their own, with history.visibilityProcessorSchedulerWorkerCount (512) workers per History host, and each task writes the record with one call to the visibility store, built from the Workflow's state when the task runs. Until the task completes, lists and searches show the previous record, or none for a new Workflow."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
