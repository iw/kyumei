[[statement]]
id = "behaviour.visibility-store-writes"
category = "behaviour"
title = "How a visibility write reaches SQL or Elasticsearch"
statement = "A visibility task's write runs under a 3-second timeout. With a SQL visibility store it is one statement on the database, within that timeout. With Elasticsearch, History's bulk processor gathers writes and sends them in bulks, when it holds worker.ESProcessorBulkActions (500) of them and every worker.ESProcessorFlushInterval (1 second) regardless; a write waits to join a bulk while the processor is busy sending the last one. The write then waits for Elasticsearch to acknowledge its bulk for up to worker.ESProcessorAckTimeout (30 seconds), ignoring the task's timeout. A write Elasticsearch rejects fails with Unavailable (\"visibility task received NACK\"), and one still unacknowledged after 30 seconds fails with a timeout error."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
