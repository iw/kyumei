[[statement]]
id = "behaviour.es-bulk-latencies"
category = "behaviour"
title = "Where an Elasticsearch visibility write spends its time"
statement = "History's Elasticsearch bulk processor times each write in stages, tagged operation ElasticsearchBulkProcessor: elasticsearch_bulk_processor_wait_add_latency, waiting to join a bulk; elasticsearch_bulk_processor_wait_start_latency, from joining until the bulk is sent; elasticsearch_bulk_processor_commit_latency, from sending the bulk until Elasticsearch answers; and elasticsearch_bulk_processor_request_latency, the whole. elasticsearch_bulk_processor_errors counts the writes in bulks that failed and the writes Elasticsearch rejected, tagged with the HTTP status."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
