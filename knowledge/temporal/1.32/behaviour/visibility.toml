[[statement]]
id = "limit.visibility-persistence-qps"
category = "limit"
title = "Each host limits its calls to the visibility store"
statement = "Every server host limits its own calls to the visibility store, with no limit per namespace: writes at system.visibilityPersistenceMaxWriteQPS, and reads (listing, counting and getting records) at system.visibilityPersistenceMaxReadQPS, 9,000 per second each by default. History makes the writes; the Frontend makes the reads that listing and counting calls need. A call over the limit is refused at once with ResourceExhausted, cause PersistenceLimit and scope System (\"System Persistence Max QPS Reached.\"), and counted in visibility_persistence_resource_exhausted. History retries a refused visibility task after a backoff; the Frontend returns the error to the caller."
notes = ["History's backoff after repeated refusals is at least 3 seconds (behaviour.history-task-retries)."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
