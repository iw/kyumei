[[statement]]
id = "sdk.java-thread-forced-eviction"
category = "behaviour"
title = "A Java Worker out of threads evicts a cached Workflow, or fails the task"
statement = "When a Java Workflow needs a thread and the pool has none free, the Worker evicts a cached Workflow that no task is processing, freeing its threads, and counts temporal_sticky_cache_thread_forced_eviction; the evicted Workflow replays its whole history at its next task. If every cached Workflow is being processed, nothing can be evicted and the Workflow Task fails with WorkflowRejectedExecutionError, without waiting for a thread. The Worker logs \"Workflow task processing failure\" and counts workflow_task_execution_failed with failure_reason WorkflowError; it reports the failure to the server only on the task's first attempt, and later attempts time out. An eviction is not counted while the Workflow that needs the thread is replaying its history."
scope = { sdk = [{ family = "java", revision = "sdk-java v1.40.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-13 }
