# How the Java SDK (v1.40.0) runs Workflows on a bounded pool of threads,
# what holds those threads, and what a Worker does when none is free.

[[statement]]
id = "sdk.java-workflow-thread-pool"
category = "behaviour"
title = "Java Workflows run on a bounded pool of threads"
statement = "A Java worker factory runs its Workflows on one pool of at most WorkerFactoryOptions.maxWorkflowThreadCount threads (600 by default, and 600 when set to 0), shared by all its Workers and counting the threads of cached Workflows. A Workflow takes a thread when it starts running and keeps it while it waits, so every cached Workflow holds at least one. More threads are held by each Signal or Update being handled, until its handler returns, and by each branch run with Async.function or Async.procedure on anything other than an Activity or child Workflow stub, until the branch finishes. The factory's Workflow cache, WorkerFactoryOptions.workflowCacheSize, is also 600 by default. With setUsingVirtualWorkflowThreads (JDK 21 or later, off by default) Workflows run on virtual threads and maxWorkflowThreadCount is ignored."
scope = { sdk = [{ family = "java", revision = "sdk-java v1.40.0" }] }
