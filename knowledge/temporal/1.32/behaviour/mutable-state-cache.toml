[[statement]]
id = "behaviour.cache-key-per-shard-owner"
category = "behaviour"
title = "A shard that moves or reloads starts with a cold cache"
statement = "A cached Workflow's key includes the owner of its shard, a value unique to each time a host takes the shard. When a shard moves to another host or reloads, its Workflows miss the cache until they are read again."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
