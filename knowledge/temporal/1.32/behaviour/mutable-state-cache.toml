# History's host-level Workflow (mutable state) cache in Temporal Server
# 1.32: its size, what a miss costs, and what fills it.

[[statement]]
id = "behaviour.mutable-state-cache"
category = "behaviour"
title = "History caches Workflow state per host, and a miss reads the database"
statement = "History keeps the state of Workflows it has loaded in one cache per host, of history.hostLevelCacheMaxSize entries (128,000 by default, read when the host starts). A request or task whose Workflow is not cached counts a cache miss and reads the Workflow's state from the database with GetWorkflowExecution. A full cache evicts the least recently used Workflow that nothing is using; if every entry is in use, the request fails with ResourceExhausted, \"cache capacity is fully occupied with pinned elements\"."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/cache/cache.go", line = 96, excerpt = "func NewHostLevelCache(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/cache/cache.go", line = 101, excerpt = "maxSize := config.HistoryHostLevelCacheMaxSize()" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 1858, excerpt = "\"history.hostLevelCacheMaxSize\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 1859, excerpt = "128000," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 1861, excerpt = "Requires service restart to take effect.`," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/cache/cache.go", line = 287, excerpt = "item, cacheHit := c.Get(cacheKey).(*cacheItem)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/cache/cache.go", line = 292, excerpt = "metrics.CacheMissCounter.With(handler).Record(1)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 387, excerpt = "if c.MutableState == nil {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 388, excerpt = "response, err := getWorkflowExecution(ctx, shardContext, &persistence.GetWorkflowExecutionRequest{" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/cache/lru.go", line = 349, excerpt = "c.tryEvictUntilEnoughSpaceWithSkipEntry(newEntrySize, nil)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/cache/lru.go", line = 417, excerpt = "if entry.refCount == 0 {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/cache/lru.go", line = 354, excerpt = "return nil, ErrCacheFull" },
