# How Activity Tasks are scheduled and reach Matching in 1.32.

[[statement]]
id = "behaviour.schedule-activity-adds-task"
category = "behaviour"
title = "Each scheduled Activity adds an Activity Task"
statement = "When a Workflow Task completes with a ScheduleActivityTask command, History records the Activity as scheduled and generates a transfer task, which adds an Activity Task to Matching with AddActivityTask. An Activity started eagerly, returned to the Worker with the completion, is not added. A retry is added again when its retry timer fires, without a new command."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
