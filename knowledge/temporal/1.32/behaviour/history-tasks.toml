[[statement]]
id = "behaviour.history-task-retries"
category = "behaviour"
title = "Throttled History tasks are retried with backoff"
statement = "A History task that fails with ResourceExhausted is counted in task_errors_throttled by cause and retried. A persistence limit refusing its calls gives cause PersistenceLimit; another caller holding the Workflow's lock for longer than history.cacheNonUserContextLockTimeout (500 ms) gives BusyWorkflow. After the first, each further consecutive ResourceExhausted other than BusyWorkflow makes the task wait at least 3 seconds before its next attempt, growing by half each time up to 5 minutes. Other unexpected errors are counted in task_errors and retried with backoff."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 491, excerpt = "metrics.TaskThrottledCounter.With(e.chasmMetricsHandler).Record(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 492, excerpt = "1, metrics.ResourceExhaustedCauseTag(resourceExhaustedErr.Cause))" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/persistence/persistence_rate_limited_clients.go", line = 25, excerpt = "Cause:   enumspb.RESOURCE_EXHAUSTED_CAUSE_PERSISTENCE_LIMIT," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/cache/cache.go", line = 337, excerpt = "newDeadline := time.Now().Add(c.nonUserContextLockTimeout)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/cache/cache.go", line = 354, excerpt = "return consts.ErrResourceExhaustedBusyWorkflow" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/consts/const.go", line = 104, excerpt = "Cause:   enumspb.RESOURCE_EXHAUSTED_CAUSE_BUSY_WORKFLOW," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 1852, excerpt = "\"history.cacheNonUserContextLockTimeout\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 1853, excerpt = "500*time.Millisecond," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 488, excerpt = "e.resourceExhaustedCount++" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 101, excerpt = "resourceExhaustedResubmitMaxAttempts = 1" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 803, excerpt = "if !errors.Is(err, consts.ErrResourceExhaustedBusyWorkflow) &&" },
