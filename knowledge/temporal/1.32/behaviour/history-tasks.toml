# How History processes its own tasks (timers, transfer and visibility tasks)
# in Temporal Server 1.32: loading, scheduling, retrying, and what each
# latency metric measures.

[[statement]]
id = "behaviour.history-task-pipeline"
category = "behaviour"
title = "History tasks are loaded, then wait for a host-wide scheduler"
statement = "Each History shard keeps a queue per task category: timers in a scheduled queue, and transfer and visibility tasks in immediate queues. A queue's readers load tasks from the database, and pause while the queue holds history.queuePendingTasksMaxCount (10,000) tasks not yet completed. Loaded tasks then wait for one of the workers of a scheduler that every shard on the host shares: history.timerProcessorSchedulerWorkerCount and history.transferProcessorSchedulerWorkerCount, 512 each by default."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/timer_queue_factory.go", line = 177, excerpt = "return queues.NewScheduledQueue(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/transfer_queue_factory.go", line = 177, excerpt = "return queues.NewImmediateQueue(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/reader.go", line = 441, excerpt = "if !r.verifyPendingTaskSize() {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/reader.go", line = 532, excerpt = "return r.monitor.GetTotalPendingTaskCount() < r.options.MaxPendingTasksCount()" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 2044, excerpt = "\"history.queuePendingTasksMaxCount\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 2045, excerpt = "10000," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/timer_queue_factory.go", line = 45, excerpt = "HostScheduler: queues.NewScheduler(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/transfer_queue_factory.go", line = 52, excerpt = "HostScheduler: queues.NewScheduler(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 2157, excerpt = "\"history.timerProcessorSchedulerWorkerCount\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 2158, excerpt = "512," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 2245, excerpt = "512," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 2244, excerpt = "\"history.transferProcessorSchedulerWorkerCount\"," },
]

[[statement]]
id = "behaviour.history-task-latencies"
category = "behaviour"
title = "What each History task latency measures"
statement = "task_latency_load runs from a task's creation, or for a timer from its fire time, to its loading into memory; task_latency_schedule, from loading or a retry to an attempt starting on a scheduler worker; task_latency_processing, one attempt's execution; and task_latency_queue, from creation or fire time to completion, across every attempt. For a timer, task_latency_queue is how late it completed after it was due to fire."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 247, excerpt = "loadTime := util.MaxTime(timeSource.Now(), task.GetKey().FireTime)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 249, excerpt = "loadTime.Sub(task.GetVisibilityTime())," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/shard/task_key_generator.go", line = 76, excerpt = "taskScheduledTime = task.GetVisibilityTime()." },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 257, excerpt = "e.scheduleLatency = startTime.Sub(e.scheduledTime)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 357, excerpt = "metrics.TaskScheduleLatency.With(priorityTaggedProvider).Record(e.scheduleLatency)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 345, excerpt = "attemptLatency := e.timeSource.Now().Sub(startTime)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 348, excerpt = "metrics.TaskProcessingLatency.With(e.chasmMetricsHandler).Record(attemptLatency)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/queues/executable.go", line = 703, excerpt = "Record(time.Since(e.GetVisibilityTime()))" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/metrics/metric_defs.go", line = 856, excerpt = "WithDescription(\"Latency from history task generation to loading into memory (persistence schedule to start latency).\")," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/metrics/metric_defs.go", line = 881, excerpt = "WithDescription(\"End-to-end latency for processing and completing a history task, from task generation to completion.\")," },
