[[statement]]
id = "sdk.full-history-replay"
category = "behaviour"
title = "A Workflow missing from the cache is replayed from its first event"
statement = "A Workflow Task for a Workflow that is not in the Worker's cache is replayed from the start of the history. A task from the normal queue carries the whole history. A sticky task carries only the new events, so the Worker first fetches the whole history; Core, Go and Java count that as a sticky cache miss. A task that arrives with the whole history is never counted as a miss."
scope = { server = ["1.32.0", "1.32.1"], sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }, { family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
