[[statement]]
id = "sdk.workflow-cache-size"
category = "sdk-configuration"
title = "How many Workflows a Worker caches"
statement = "Workers cache the Workflows they run, up to a configured number: 10,000 per process in Go (worker.SetStickyWorkflowCacheSize), 600 per worker factory in Java (WorkerFactoryOptions.workflowCacheSize), and 1,000 per Worker in Python (max_cached_workflows). With a size of 0, Go and Core-based Workers use no sticky queue, so every task carries and replays the whole history; Java treats 0 as its default."
notes = ["In Java the number of Workflow threads, maxWorkflowThreadCount (600 by default), usually limits the cache before its size does."]
scope = { sdk = [{ family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }, { family = "core", revision = "sdk-rust acac9e3f" }, { family = "core", revision = "sdk-python 1.25.0" }] }
