# Sticky execution in Temporal Server 1.32 and the Core, Go and Java SDKs:
# how a Workflow's tasks are routed to the Worker that caches it, what happens
# when that Worker is gone, and when a Worker replays a whole history.

[[statement]]
id = "behaviour.sticky-queue-routing"
category = "behaviour"
title = "A Workflow's next task goes to the Worker that ran the last one"
statement = "When a Worker completes a Workflow Task with sticky attributes, History sends the Workflow's next task to that Worker's own sticky queue, with the schedule-to-start timeout the Worker chose: 5 seconds by default in Go and Java, 10 seconds in Core. If no Worker has polled the sticky queue for 10 seconds, Matching refuses the task and History sends it to the Task Queue's normal queue at once. If the sticky queue accepts the task but no Worker starts it within the timeout, History times it out and schedules it again on the normal queue."
notes = ["Only Workflow Tasks on a sticky queue, and speculative ones for Workflow Updates (5 seconds), have a schedule-to-start timeout."]
scope = { server = ["1.32.0", "1.32.1"], sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }, { family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
