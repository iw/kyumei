[[statement]]
id = "sdk.core-reserved-slot-counts-free"
category = "behaviour"
title = "Core counts a slot held by a poll as free"
statement = "A Core-based Worker counts a slot it has reserved for an outstanding poll as available in worker_task_slots_available until the poll returns a task. A Worker whose slots are all busy therefore reports a free slot while each poll that follows a finished task is in flight."
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-19 }
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/abstractions.rs", line = 23, excerpt = "/// The number of permit owners who have acquired a permit, but are not yet meaningfully using" },
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/abstractions.rs", line = 174, excerpt = "mets.available_task_slots(avail + unused + available_adjustment);" },
