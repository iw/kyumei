provenance = [
  { source = "sdk-go-v1.44.0", path = "internal/worker.go", line = 136, excerpt = "// This is managed by the server and controls activities per second for your entire taskqueue" },
  { source = "sdk-go-v1.44.0", path = "internal/worker.go", line = 146, excerpt = "TaskQueueActivitiesPerSecond float64" },
  { source = "sdk-java-v1.40.0", path = "temporal-sdk/src/main/java/io/temporal/worker/WorkerOptions.java", line = 224, excerpt = "* This is managed by the server and controls activities per second for the entire task queue" },
