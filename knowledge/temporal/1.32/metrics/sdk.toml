# Statements about SDK (Worker-side) metrics and SDK configuration.
#
# The metrics themselves are generated from the Core, Go and Java SDK sources
# (generated/sdk-metrics.toml); the label sets and notes a diagnostic relies on are reviewed
# annotations (sdk-annotations.toml). The statements below say how each SDK's names reach
# Prometheus, which the generated expositions follow.

[[statement]]
id = "sdk.core-metric-prefix"
category = "sdk-configuration"
title = "Core SDK metric prefix"
statement = "Core-based SDKs prefix metric names with `temporal_` unless a different prefix is configured."
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-09-30 }
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry.rs", line = 45, excerpt = "pub static METRIC_PREFIX: &str = \"temporal_\";" },
]

[[statement]]
id = "sdk.core-duration-unit"
category = "sdk-configuration"
title = "Core SDK duration unit"
statement = "Core-based SDKs export durations as milliseconds unless configured to use seconds (`use_seconds_for_durations`; `durations_as_seconds` in Python)."
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-09-30 }
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry.rs", line = 147, excerpt = "/// If set to true, use f64 seconds for durations instead of u64 milliseconds" },
  { source = "sdk-python-1.25.0", path = "temporalio/runtime.py", line = 346, excerpt = "durations_as_seconds: bool = False" },
]

[[statement]]
id = "sdk.core-prometheus-naming"
category = "sdk-configuration"
title = "Core SDK Prometheus metric names"
statement = "Core's Prometheus exporter exports each metric under its name with the metric prefix (`temporal_` by default). Counters gain `_total` only with `counters_total_suffix`, and histograms gain their unit (`_milliseconds`, or `_seconds` with `use_seconds_for_durations`) only with `unit_suffix`. All three options are off by default."
notes = [
  "`counters_total_suffix` appends `_total` even to a name that already ends with it, so `local_activity_total` becomes `temporal_local_activity_total_total`.",
  "Kyumei does not cover Core's OTLP exporter: the names it reaches Prometheus under depend on the collector.",
]
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-03 }
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry.rs", line = 344, excerpt = "Arc::new(PrefixedMetricsMeter::new(self.metric_prefix.clone(), m))" },
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry.rs", line = 167, excerpt = "/// If set true, all counters will include a \"_total\" suffix" },
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry.rs", line = 170, excerpt = "/// If set true, all histograms will include the unit in their name as a suffix." },
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry.rs", line = 174, excerpt = "/// If set to true, use f64 seconds for durations instead of u64 milliseconds" },
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry/prometheus_meter.rs", line = 566, excerpt = "metric_name.push_str(\"_total\");" },
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry/prometheus_meter.rs", line = 590, excerpt = "params.unit = \"milliseconds\".into();" },
  { source = "sdk-core-acac9e3f", path = "crates/common/src/telemetry/prometheus_meter.rs", line = 636, excerpt = "format!(\"{base_name}_{unit}\")" },
]

[[statement]]
id = "sdk.go-metrics-naming"
category = "sdk-configuration"
title = "Go SDK Prometheus metric names"
statement = "Go SDK metric names include the `temporal_` prefix. The tally handler exports them unchanged, with timers in seconds through tally's Prometheus reporter, unless the scope is wrapped in `NewPrometheusNamingScope`, which appends `_total` to counters and `_seconds` to timers. The OpenTelemetry handler records timers in seconds, which the OpenTelemetry Prometheus exporter suffixes `_seconds`, and counters as up-down counters, which the exporter writes as gauges without `_total`, unless `UseMonotonicCounters` is set."
notes = ["Every Go timer is exported in seconds; only the name changes with the handler."]
scope = { sdk = [{ family = "go", revision = "sdk-go v1.44.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-03 }
provenance = [
  { source = "sdk-go-contrib-tally-v0.2.0", path = "prometheus.go", line = 49, excerpt = "name += \"_total\"" },
  { source = "sdk-go-contrib-tally-v0.2.0", path = "prometheus.go", line = 60, excerpt = "name += \"_seconds\"" },
  { source = "sdk-go-contrib-tally-v0.2.0", path = "handler.go", line = 44, excerpt = "scope = contribtally.NewPrometheusNamingScope(scope)" },
  { source = "tally-v4.1.17", path = "prometheus/reporter.go", line = 182, excerpt = "m.histogram.Observe(float64(interval) / float64(time.Second))" },
  { source = "sdk-go-contrib-opentelemetry-v0.8.0", path = "handler.go", line = 117, excerpt = "c, err = m.meter.Int64UpDownCounter(name)" },
  { source = "sdk-go-contrib-opentelemetry-v0.8.0", path = "handler.go", line = 38, excerpt = "// UseMonotonicCounters causes [MetricsHandler.Counter] to use OpenTelemetry's Int64Counter" },
  { source = "sdk-go-contrib-opentelemetry-v0.8.0", path = "handler.go", line = 140, excerpt = "h, err := m.meter.Float64Histogram(name, metric.WithUnit(\"s\"))" },
  { source = "sdk-go-contrib-opentelemetry-v0.8.0", path = "handler.go", line = 146, excerpt = "h.Record(context.Background(), t.Seconds(), metric.WithAttributeSet(m.attributes))" },
  { source = "otel-exporter-prometheus-v0.56.0", path = "exporter.go", line = 443, excerpt = "return dto.MetricType_GAUGE.Enum()" },
  { source = "otel-exporter-prometheus-v0.56.0", path = "exporter.go", line = 374, excerpt = "\"s\": \"_seconds\"," },
]

[[statement]]
id = "sdk.go-tally-label-values"
category = "sdk-configuration"
title = "Go SDK tally label values"
statement = "The Go SDK's `PrometheusSanitizeOptions`, which the tally handler's documentation passes to tally, write every character of a label value other than an ASCII letter, a digit or `_` as `_`, so a Task Queue named `order-fulfillment` is labelled `order_fulfillment`. The OpenTelemetry handler's exporter writes label values unchanged."
scope = { sdk = [{ family = "go", revision = "sdk-go v1.44.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-13 }
provenance = [
  { source = "sdk-go-contrib-tally-v0.2.0", path = "prometheus.go", line = 33, excerpt = "var PrometheusSanitizeOptions = tally.SanitizeOptions{" },
  { source = "sdk-go-contrib-tally-v0.2.0", path = "prometheus.go", line = 36, excerpt = "ValueCharacters:      tally.ValidCharacters{Ranges: tally.AlphanumericRange, Characters: []rune{'_'}}," },
  { source = "sdk-go-contrib-tally-v0.2.0", path = "handler.go", line = 40, excerpt = "// 		SanitizeOptions: &contribtally.PrometheusSanitizeOptions," },
  { source = "tally-v4.1.17", path = "scope_registry.go", line = 205, excerpt = "tags = parent.copyAndSanitizeMap(tags)" },
  { source = "tally-v4.1.17", path = "scope.go", line = 589, excerpt = "v = s.sanitizer.Value(v)" },
  { source = "otel-exporter-prometheus-v0.56.0", path = "exporter.go", line = 327, excerpt = "values = append(values, kv.Value.Emit())" },
]

