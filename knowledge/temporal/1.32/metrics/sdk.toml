  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/worker/mod.rs", line = 203, excerpt = "/// workers on the same queue have different values set, they will thrash with the last poller" },
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/worker/mod.rs", line = 207, excerpt = "pub max_task_queue_activities_per_second: Option<f64>," },
