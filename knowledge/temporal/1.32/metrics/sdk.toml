[[statement]]
id = "sdk.task-queue-activities-per-second"
category = "sdk-configuration"
title = "The Task Queue-wide Activity rate option"
statement = "Each SDK has a Worker option that sets the rate at which the server dispatches Activity Tasks from the whole Task Queue, not from one Worker: TaskQueueActivitiesPerSecond in Go, setMaxTaskQueueActivitiesPerSecond in Java, and max_task_queue_activities_per_second in Core-based SDKs (the Python Worker's argument of the same name). The Worker sends it with every Activity poll (limit.activity-worker-rate)."
notes = [
  "Workers on the same Task Queue with different values overwrite each other's: the latest poll wins.",
  "To limit one Worker instead, the SDKs have a per-Worker option, such as WorkerActivitiesPerSecond in Go and setMaxWorkerActivitiesPerSecond in Java.",
]
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }, { family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }] }
