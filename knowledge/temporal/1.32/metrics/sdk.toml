[[statement]]
id = "sdk.core-poll-needs-slot"
category = "behaviour"
title = "Core pollers reserve a slot before polling"
statement = "A Core-based Worker acquires a Workflow Task slot permit before it issues each Workflow Task poll, so a Worker with no free slots stops polling."
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-09-30 }
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/pollers/poll_buffer.rs", line = 391, excerpt = "p = permit_dealer.acquire_owned() => p," },
]

