claim = "server.service_requests"
scope = { server = ["1.32.0", "1.32.1"] }
labels = [
  { name = "operation", purpose = "RPC method name, e.g. SignalWorkflowExecution or PollWorkflowTaskQueue." },
  { name = "namespace" },
  { name = "service_name", values = ["frontend", "history", "matching", "worker", "internal-frontend"] },
