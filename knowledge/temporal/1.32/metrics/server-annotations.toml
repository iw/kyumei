# Reviewed additions to generated server metric claims (generated/server-metrics.toml).
#
# A definition says nothing about tags, which are attached where a metric is recorded, and
# most definitions have no description. Each annotation below adds what a reviewer read at
# the recording sites: the label set, a purpose, a gauge's unit, notes, and the provenance
# for them. Every metric a diagnostic signal reads needs a reviewed label set, because the
# validator checks the signal's label constraints against it.
#
# `gen-metric-claims --emitters FILE` lists each metric's recording sites and the tag helpers
# called there, as a starting point for a review.

# ---------------------------------------------------------------- Frontend RPCs

