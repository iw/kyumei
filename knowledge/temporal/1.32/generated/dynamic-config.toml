[[dynamic_config]]
id = "dc.worker.removableBuildIdDurationSinceDefault"
key = "worker.removableBuildIdDurationSinceDefault"
setting = "NewGlobalDurationSetting"
value_type = "duration"
default = "1h"
constrained_by = "global"
description = "RemovableBuildIdDurationSinceDefault is the minimum duration since a build id was last default in its containing set for it to be considered for removal, used by the build id scavenger. This setting allows some propagation delay of versioning data, which may happen for the following reasons: 1. There are no workflows currently marked as open in the visibility store but a worker for the demoted version is currently processing a task. 2. There are delays in the visibility task processor (which is asynchronous). 3. There's propagation delay of the versioning data between matching nodes."
