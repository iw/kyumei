[[dynamic_config]]
id = "dc.callback.allowedAddresses"
key = "callback.allowedAddresses"
setting = "NewNamespaceTypedSettingWithConverter"
value_type = "typed"
default = "AddressMatchRules{}"
constrained_by = "namespace"
description = """The per-namespace list of addresses that are allowed for callbacks and whether secure connections (https) are required. URLs: "temporal://system" and "temporal://internal" are always allowed. The default is no address rules. URLs are checked against each in order when starting a workflow or activitiy with attached callbacks or a standalone callback and only need to match one to pass validation. This configuration is required for external endpoint targets; any invalid entries are ignored. Each entry is a map with possible values: - "Pattern":string (required) the host:port pattern to which this config applies. Wildcards, '*', are supported and can match any number of characters (e.g. '*' matches everything, 'prefix.*.domain' matches 'prefix.a.domain' as well as 'prefix.a.b.domain'). - "AllowInsecure":bool (optional, default=false) indicates whether https is required"""
notes = ["The default is not a constant; it is shown as written in Go."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "chasm/lib/callback/config.go", line = 83, excerpt = '"callback.allowedAddresses",' },
]

