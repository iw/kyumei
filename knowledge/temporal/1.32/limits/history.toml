  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1368, excerpt = "if err := c.forceTerminateWorkflow(ctx, shardContext, common.FailureReasonMutableStateSizeExceedsLimit); err != nil {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1441, excerpt = "consts.IdentityHistoryService," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/util.go", line = 107, excerpt = "FailureReasonHistorySizeExceedsLimit = \"Workflow history size exceeds limit.\"" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/util.go", line = 109, excerpt = "FailureReasonHistoryCountExceedsLimit = \"Workflow history count exceeds limit.\"" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/util.go", line = 111, excerpt = "FailureReasonMutableStateSizeExceedsLimit = \"Workflow mutable state size exceeds limit.\"" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/consts/const.go", line = 13, excerpt = "IdentityHistoryService = \"history-service\"" },
