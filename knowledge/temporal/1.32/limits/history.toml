# Per-Workflow history limits in Temporal Server 1.32: what History does
# when a history grows past them, and the continue-as-new suggestion before.

[[statement]]
id = "limit.history-size-and-count"
category = "limit"
title = "History size and event count limits terminate a Workflow"
statement = "When an update finds a running Workflow's history larger than limit.historySize.error (50 MiB by default) or with more events than limit.historyCount.error (51,200 by default), History discards the update and terminates the Workflow. It checks the size first, then the event count, then the Workflow's mutable state against limit.mutableStateSize.error (8 MiB by default). The caller, usually the Worker completing a Workflow Task, gets an InvalidArgument error. The warn limits, limit.historySize.warn (10 MiB) and limit.historyCount.warn (10,240 events), only log a warning."
notes = ["limit.historySize.error and limit.historyCount.error are set per namespace; limit.mutableStateSize.error is global."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 672, excerpt = "historySizeForceTerminate, err := c.enforceHistorySizeCheck(ctx, shardContext)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 678, excerpt = "historyCountForceTerminate, err = c.enforceHistoryCountCheck(ctx, shardContext)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 685, excerpt = "msForceTerminate, err = c.enforceMutableStateSizeCheck(ctx, shardContext)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1311, excerpt = "if historySize > historySizeLimitError && c.MutableState.IsWorkflowExecutionRunning() {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1349, excerpt = "if historyCount > historyCountLimitError && c.MutableState.IsWorkflowExecutionRunning() {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1390, excerpt = "if mutableStateSize > mutableStateSizeLimitError {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1420, excerpt = "c.Clear()" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 713, excerpt = "return consts.ErrHistorySizeExceedsLimit" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/consts/const.go", line = 81, excerpt = "ErrHistorySizeExceedsLimit = serviceerror.NewInvalidArgument(common.FailureReasonHistorySizeExceedsLimit)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1319, excerpt = "c.throttledLogger.Warn(\"history size exceeds warn limit.\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1357, excerpt = "c.throttledLogger.Warn(\"history count exceeds warn limit.\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 432, excerpt = "\"limit.historySize.error\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 433, excerpt = "50*1024*1024," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 448, excerpt = "\"limit.historyCount.error\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 449, excerpt = "50*1024," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 469, excerpt = "\"limit.mutableStateSize.error\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 470, excerpt = "8*1024*1024," },
]

[[statement]]
id = "behaviour.limit-termination-reason"
category = "behaviour"
title = "A Workflow a history limit terminates says which limit"
statement = "A Workflow terminated by a history limit ends with a WorkflowExecutionTerminated event whose identity is history-service and whose reason is \"Workflow history size exceeds limit.\", \"Workflow history count exceeds limit.\" or \"Workflow mutable state size exceeds limit.\"."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/context.go", line = 1294, excerpt = "if err := c.forceTerminateWorkflow(ctx, shardContext, common.FailureReasonHistorySizeExceedsLimit); err != nil {" },
