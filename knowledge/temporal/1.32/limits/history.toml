[[statement]]
id = "behaviour.suggest-continue-as-new"
category = "behaviour"
title = "History suggests continue-as-new before the limits"
statement = "When a Workflow Task starts on a history of at least limit.historySize.suggestContinueAsNew (4 MiB by default) or limit.historyCount.suggestContinueAsNew (4,096 events by default), History marks the task's WorkflowTaskStarted event to suggest continue-as-new, on every task while the history stays past the threshold, and counts it in workflow_suggest_continue_as_new_count. The SDKs pass the suggestion to Workflow code, which must act on it."
notes = ["Go reads it with GetContinueAsNewSuggested, Java with isContinueAsNewSuggested and Python with is_continue_as_new_suggested."]
scope = { server = ["1.32.0", "1.32.1"], sdk = [{ family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }, { family = "core", revision = "sdk-python 1.25.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/workflow_task_state_machine.go", line = 1508, excerpt = "if historySize >= sizeLimit {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/workflow_task_state_machine.go", line = 1509, excerpt = "reasons = append(reasons, enumspb.SUGGEST_CONTINUE_AS_NEW_REASON_HISTORY_SIZE_TOO_LARGE)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/workflow_task_state_machine.go", line = 1511, excerpt = "if historyCount >= countLimit {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/workflow_task_state_machine.go", line = 1512, excerpt = "reasons = append(reasons, enumspb.SUGGEST_CONTINUE_AS_NEW_REASON_TOO_MANY_HISTORY_EVENTS)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/historybuilder/event_factory.go", line = 142, excerpt = "SuggestContinueAsNew:        suggestContinueAsNew," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/history/workflow/workflow_task_state_machine.go", line = 551, excerpt = "metrics.WorkflowSuggestContinueAsNewCount.With(m.metricsHandler.WithTags(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 442, excerpt = "\"limit.historySize.suggestContinueAsNew\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 443, excerpt = "4*1024*1024," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 484, excerpt = "\"limit.historyCount.suggestContinueAsNew\"," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/dynamicconfig/constants.go", line = 485, excerpt = "4*1024," },
  { source = "sdk-go-v1.44.0", path = "internal/workflow.go", line = 1594, excerpt = "func (wInfo *WorkflowInfo) GetContinueAsNewSuggested() bool {" },
  { source = "sdk-java-v1.40.0", path = "temporal-sdk/src/main/java/io/temporal/workflow/WorkflowInfo.java", line = 164, excerpt = "boolean isContinueAsNewSuggested();" },
  { source = "sdk-python-1.25.0", path = "temporalio/workflow.py", line = 595, excerpt = "def is_continue_as_new_suggested(self) -> bool:" },
