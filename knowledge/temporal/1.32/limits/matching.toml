# How Matching limits the rate it dispatches tasks in 1.32, read from source.
#
# A partition's dispatch rate comes from three sources: the system default (dynamic
# configuration), a rate an Activity Worker sends with each poll, and a rate set through the
# UpdateTaskQueueConfig API. The settings named here are generated dynamic configuration claims.

[[statement]]
id = "limit.task-queue-dispatch"
category = "limit"
title = "A Task Queue's dispatch ceiling"
statement = "Without an API or Worker rate limit, Matching computes a partition's dispatch limit as the minimum of `admin.matchingNamespaceToPartitionDispatchRate` and `admin.matchingNamespaceTaskqueueToPartitionDispatchRate` (1,000 tasks/s by default). DescribeTaskQueue reports the Task Queue's limit as that times its read partitions, with source System. The partition enforces it only once its effective rate has changed since the partition loaded (limit.dispatch-applied-on-change)."
notes = ["The same system default applies to Workflow and Activity Task Queues; each type of a partition has its own limiter."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 146, excerpt = "systemRPS := min(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 206, excerpt = "return r.effectiveRPS * float64(r.numReadPartitions), r.rateLimitSource" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 166, excerpt = "r.rateLimitSource = enumspb.RATE_LIMIT_SOURCE_SYSTEM" },
]

[[statement]]
id = "limit.dispatch-applied-on-change"
category = "limit"
title = "A partition applies its dispatch limit only when it changes"
statement = "Matching configures a partition's dispatch limiters only when the partition's effective rate changes after it loads. The rate computed at load is not applied: until something changes it, the default matcher dispatches without a limit (the classic matcher allows 100,000 tasks/s). So the system default is not enforced on a partition that has known no other rate since it loaded, while DescribeTaskQueue still reports it as the effective limit. It takes effect once the rate has changed, for example after a Worker or API limit below it is set and later removed, or after one of its dynamic configuration settings changes."
notes = [
  "An Activity Worker's rate takes effect at once when it is below the system default, because it changes the effective rate.",
  "The code's own comment says the effective rate is the minimum of the sources, so this looks unintended.",
  "Confirmed on 3 October 2026 by a probe test against the v1.31.0 source: a partition built with default configuration dispatched 5,000 tasks in one instant without waiting, and was limited to 1,000 tasks/s only after a Worker rate of 400/s was set and removed. In 1.32 the partition's Start computes the effective rate in the same way without applying it.",
]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 104, excerpt = "r.computeEffectiveRPSAndSourceLocked()" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 175, excerpt = "if oldRPS != newRPS {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 177, excerpt = "r.updateSimpleRateLimitWithBurstLocked(defaultBurstDuration)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 276, excerpt = "r.wholeQueueLimit = makeSimpleLimiterParams(newRPS, burstDuration)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/matcher_data.go", line = 686, excerpt = "interval time.Duration // ideal task spacing interval, or 0 for no limit (infinite), or -1 for zero limit" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 81, excerpt = "defaultTaskDispatchRPS," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/task_queue_partition_manager.go", line = 59, excerpt = "defaultTaskDispatchRPS    = 100000.0" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 136, excerpt = "// - If an API-level RPS is configured, effectiveRPS = min(system default RPS, API-configured RPS)" },
]

[[statement]]
id = "limit.activity-worker-rate"
category = "limit"
title = "An Activity Worker's rate limit"
statement = "An Activity Worker sends its Task Queue rate (TaskQueueActivitiesPerSecond in Go) with every poll, and the latest poll on a partition replaces the partition's Worker rate; a poll without one clears it. The rate is divided by the read partitions and applies when it is below the system default, and DescribeTaskQueue then reports it with source Worker. Workflow Task Queues take no Worker rate."
notes = [
  "The Go SDK sends 100,000/s when the option is unset, which is above the default system limit.",
  "Workers polling the same Task Queue with different rates overwrite each other's.",
  "In 1.32 the rate is also multiplied by the queue's rate-limit fraction, which is 1 unless the server is built with another provider.",
]
scope = { server = ["1.32.0", "1.32.1"], sdk = [{ family = "go", revision = "sdk-go v1.44.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/matching_engine.go", line = 982, excerpt = "taskQueueMetadata:         request.TaskQueueMetadata," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/task_queue_partition_manager.go", line = 841, excerpt = "// Last poller wins if different pollers provide different values" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/task_queue_partition_manager.go", line = 846, excerpt = "pm.rateLimitManager.InjectWorkerRPS(pollMetadata)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 157, excerpt = "effectiveRPS = *r.workerRPS * fraction / float64(r.numReadPartitions)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 151, excerpt = "fraction := r.config.RateLimitFraction()" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/rate_limit_fraction_provider.go", line = 17, excerpt = "defaultRateLimitFraction = maxRateLimitFraction" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/rate_limit_fraction_provider.go", line = 40, excerpt = "var defaultTaskQueueRateLimitFractionProvider = NewTaskQueueRateLimitFractionProvider(&unitRateLimitFractionProvider{})" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/ratelimit_manager.go", line = 161, excerpt = "if effectiveRPS < r.systemRPS {" },
  { source = "temporal-api-go-v1.63.5", path = "taskqueue/v1/message.pb.go", line = 95, excerpt = "// Only applies to activity task queues" },
  { source = "sdk-go-v1.44.0", path = "internal/internal_task_pollers.go", line = 1406, excerpt = "TaskQueueMetadata: &taskqueuepb.TaskQueueMetadata{MaxTasksPerSecond: wrapperspb.Double(atp.activitiesPerSecond)}," },
