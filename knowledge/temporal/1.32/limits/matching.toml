[[statement]]
id = "behaviour.dispatch-throttle-visibility"
category = "behaviour"
title = "Throttled dispatch shows in DescribeTaskQueue, not in a metric"
statement = "When the dispatch rate limit delays a task in the default matcher, Matching retries the match on a timer and records no metric for the delay. It does remember that it did: DescribeTaskQueue's statistics report rateLimitingActive while rate limiting has blocked a dispatch within about the last 30 seconds. Otherwise the tasks wait in the backlog, so the delay shows as backlog age and task_dispatch_latency. sync_throttle_count and buffer_throttle_count count rate-limited dispatch only in the classic matcher."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/matcher_data.go", line = 541, excerpt = "d.rateLimitTimer.set(d.timeSource, d.rematchAfterTimer, minDelay)" },
