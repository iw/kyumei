[[statement]]
id = "behaviour.describe-task-queue-rate-limit"
category = "behaviour"
title = "What DescribeTaskQueue reports as the rate limit"
statement = "DescribeTaskQueue's effectiveRateLimit is the described partition's effective rate times its read partitions. Its rateLimitSource is API or Worker only when that rate is below the system default, and System otherwise. The request describes a Workflow Task Queue unless it names another type, and the enhanced mode does not report the rate limit."
notes = ["To see an Activity Task Queue's limit, describe it with type TASK_QUEUE_TYPE_ACTIVITY in the default mode. The Temporal CLI prints neither the limit nor its source (cli.task-queue-describe)."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
