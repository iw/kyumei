  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/matching/matching_engine.go", line = 1715, excerpt = "effectiveRPS, sourceForEffectiveRPS := pm.GetRateLimitManager().GetEffectiveRPSAndSource()" },
