[[statement]]
id = "limit.task-queue-api-rate"
category = "limit"
title = "A rate limit set through the API"
statement = "A queue rate limit set with UpdateTaskQueueConfig is stored in the Task Queue's user data and overrides any Worker rate, even a lower one. Divided by the read partitions, it applies when it is below the system default, and DescribeTaskQueue then reports it with source API. The Frontend refuses rate limits on Workflow Task Queues."
notes = ["In 1.32 the rate is also multiplied by the queue's rate-limit fraction, which is 1 unless the server is built with another provider."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
