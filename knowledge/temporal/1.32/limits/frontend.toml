  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/concurrent_request_limit.go", line = 140, excerpt = "return namespace.String() + \"/\" + methodName" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/concurrent_request_limit.go", line = 113, excerpt = "if float64(count) > ni.quotaCalculator.GetQuota(namespaceName.String()) {" },
