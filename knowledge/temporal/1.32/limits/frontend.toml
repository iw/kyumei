[[statement]]
id = "limit.frontend-concurrent-long-running"
category = "limit"
title = "The Frontend's cap on long-running requests in flight"
statement = "`frontend.namespaceCount` (1,200 by default) caps, on each Frontend host, the long-running requests one namespace has in flight to one API: Workflow, Activity and Nexus Task polls, QueryWorkflow, UpdateWorkflowExecution and a few others, and GetWorkflowExecutionHistory when it waits for new events. When `frontend.globalNamespaceCount` is above 0 (it is 0 by default), it replaces that, divided among the hosts. A request over the cap fails with ResourceExhausted, cause ConcurrentLimit and scope Namespace."
notes = ["The in-flight count is published as service_pending_requests, by namespace and API."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/configs/quotas.go", line = 37, excerpt = "ExecutionAPICountLimitOverride = map[string]int{" },
