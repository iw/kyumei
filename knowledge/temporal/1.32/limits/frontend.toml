  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/configs/quotas.go", line = 50, excerpt = "\"/temporal.api.workflowservice.v1.WorkflowService/QueryWorkflow\":               1," },
