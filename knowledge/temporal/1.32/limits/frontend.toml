  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 573, excerpt = "GlobalQuota:      globalNamespaceVisibilityRPS," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 510, excerpt = "quotas.NewDefaultIncomingRateBurst(rateFn)," },
