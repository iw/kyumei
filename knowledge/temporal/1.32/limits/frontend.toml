[[statement]]
id = "limit.frontend-visibility-rps"
category = "limit"
title = "Visibility APIs have their own namespace limit"
statement = "Listing, counting and scanning Workflow Executions, schedules and other visibility APIs do not use a namespace's `frontend.namespaceRPS`: each Frontend host admits a namespace's visibility requests at `frontend.namespaceRPS.visibility` (10/s by default), or at `frontend.globalNamespaceRPS.visibility` divided among the hosts when that is above 0."
notes = ["At the host level, visibility requests have their own buckets at the `frontend.rps` rate."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/configs/quotas.go", line = 215, excerpt = "VisibilityAPIToPriority = map[string]int{" },
