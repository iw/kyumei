# How the Frontend limits requests in 1.32, read from source.
#
# The settings named here are generated dynamic configuration claims (generated/); their
# notes in dynamic-config/annotations.toml point back to these statements. The priority
# order among APIs is the statement behaviour.frontend-priorities.

[[statement]]
id = "limit.frontend-namespace-rps"
category = "limit"
title = "The Frontend's limit on a namespace's requests"
statement = "Each Frontend host admits a namespace's requests at `frontend.namespaceRPS` (2,400/s by default), with a burst of `frontend.namespaceBurstRatio` (2) times that. When `frontend.globalNamespaceRPS` is above 0 (it is 0 by default), it replaces the per-host value, divided evenly among the Frontend hosts that are not draining. A request over the limit fails with ResourceExhausted, cause RpsLimit and scope Namespace."
notes = [
  "Each host enforces its share alone, so a namespace whose requests are spread unevenly across Frontend hosts is throttled on the busiest host before the cluster-wide total reaches the global limit.",
  "Visibility APIs are limited separately (limit.frontend-visibility-rps), and so are the APIs that cause namespace replication, such as UpdateNamespace.",
]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 564, excerpt = "PerInstanceQuota: serviceConfig.MaxNamespaceRPSPerInstance," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 565, excerpt = "GlobalQuota:      globalNamespaceRPS," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/quotas/calculator/cluster_aware_quota_calculator.go", line = 35, excerpt = "if clusterLimit > 0 && memberCounter != nil {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/quotas/calculator/cluster_aware_quota_calculator.go", line = 37, excerpt = "return float64(clusterLimit) / float64(clusterSize)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/quotas/calculator/cluster_aware_quota_calculator.go", line = 41, excerpt = "return float64(instanceLimit)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/membership/interfaces.go", line = 83, excerpt = "// AvailableMemberCount returns the number of hosts running this service that are accepting requests (not draining)." },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/quotas/rate_burst.go", line = 177, excerpt = "return max(1, int(math.Ceil(rateFn(namespace)*burstRatioFn(namespace))))" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 26, excerpt = "Cause:   enumspb.RESOURCE_EXHAUSTED_CAUSE_RPS_LIMIT," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 27, excerpt = "Scope:   enumspb.RESOURCE_EXHAUSTED_SCOPE_NAMESPACE," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/service.go", line = 319, excerpt = "// Overshoot since these low rate limits don't work well in an uncoordinated global limiter." },
]

[[statement]]
id = "limit.frontend-host-rps"
category = "limit"
title = "The Frontend's limit on all requests"
statement = "Each Frontend host also admits its requests, from every namespace, at `frontend.rps` (2,400/s by default), with a burst of twice that. When `frontend.globalRPS` is above 0 (it is 0 by default), it replaces `frontend.rps`, divided evenly among the Frontend hosts that are not draining. A request over the limit fails with ResourceExhausted, cause RpsLimit and scope System."
notes = [
  "Visibility APIs draw on a separate bucket at the same rate, and the APIs that cause namespace replication, such as UpdateNamespace, on `frontend.rps.namespaceReplicationInducingAPIs` (20/s by default).",
  "Health checks are exempt, and so are APIs the Frontend does not classify, such as the Admin and Operator APIs.",
]
