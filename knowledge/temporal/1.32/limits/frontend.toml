[[statement]]
id = "behaviour.frontend-limiter-order"
category = "behaviour"
title = "The order of the Frontend's limits"
statement = "The Frontend checks its limits after its telemetry interceptor, in this order: the cap on long-running requests in flight, the namespace rate limit, then the host rate limit. A rejected request is still counted in service_requests, and one the namespace limit rejects takes no host token."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 303, excerpt = "telemetryInterceptor.UnaryIntercept," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 306, excerpt = "namespaceCountLimiterInterceptor.Intercept," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 307, excerpt = "namespaceRateLimiterInterceptor.Intercept," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/fx.go", line = 308, excerpt = "rateLimitInterceptor.Intercept," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/telemetry.go", line = 177, excerpt = "metrics.ServiceRequests.With(metricsHandler).Record(1)" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/telemetry.go", line = 184, excerpt = "resp, err := handler(ctx, req)" },
]

[[statement]]
id = "behaviour.frontend-poll-wait-for-token"
category = "behaviour"
title = "Polls can wait for a namespace rate-limit token"
statement = "With `system.pollWaitForNamespaceRateLimitToken` set for a namespace (it is off by default), a Workflow, Activity or Nexus Task poll that finds the namespace limit exhausted waits for a token, until 10 seconds before its deadline, instead of failing at once. It fails with ResourceExhausted, cause RpsLimit and scope Namespace, only if less than 10 seconds remain or no token arrives in time. The wait is recorded in namespace_rate_limit_poll_wait_latency."
notes = ["Polls throttled this way are delayed rather than rejected, so they do not appear in service_errors_resource_exhausted unless the wait fails."]
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/service.go", line = 307, excerpt = "PollWaitForNamespaceRateLimitToken:                                dynamicconfig.PollWaitForNamespaceRateLimitToken.Get(dc)," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 84, excerpt = "if ni.pollWaitForToken(ns.String()) {" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "service/frontend/configs/quotas.go", line = 71, excerpt = "\"/temporal.api.workflowservice.v1.WorkflowService/PollWorkflowTaskQueue\": {}," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 122, excerpt = "return ErrNamespaceRateLimitServerBusy" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 124, excerpt = "waitCtx, cancel = context.WithDeadline(ctx, deadline.Add(-common.CriticalLongPollTimeout))" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/constants.go", line = 45, excerpt = "CriticalLongPollTimeout = time.Second * 10" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/namespace_rate_limit.go", line = 130, excerpt = "metrics.NamespaceRateLimitWaitLatency.With(ni.metricsHandler).Record(" },
]

[[statement]]
id = "behaviour.resource-exhausted-accounting"
category = "behaviour"
title = "How ResourceExhausted errors are counted"
statement = "A server RPC that fails with ResourceExhausted is counted in service_errors_resource_exhausted, tagged with the error's cause and scope as resource_exhausted_cause and resource_exhausted_scope. Only an error scoped to a namespace is treated as expected: one with any other scope, System included, is also counted in service_errors."
scope = { server = ["1.32.0", "1.32.1"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 104, excerpt = "metrics.ServiceErrResourceExhaustedCounter.With(metricsHandler).Record(" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 106, excerpt = "metrics.ResourceExhaustedCauseTag(resourceExhaustedErr.Cause)," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 107, excerpt = "metrics.ResourceExhaustedScopeTag(resourceExhaustedErr.Scope)," },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 134, excerpt = "// the result for resource exhausted depends on the resource exhausted scope and" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 157, excerpt = "return err.Scope == enumspb.RESOURCE_EXHAUSTED_SCOPE_NAMESPACE" },
  { source = ["temporal-server-v1.32.0", "temporal-server-v1.32.1"], path = "common/rpc/interceptor/request_error_handler.go", line = 115, excerpt = "metrics.ServiceFailures.With(metricsHandler).Record(1)" },
]
