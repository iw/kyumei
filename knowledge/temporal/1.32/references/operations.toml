# References to tsurdilo/temporal-server-operations: alert runbooks, playbook
# sections and dashboard panels, linked to the conclusions, hypotheses and requests
# they bear on.
#
# Every reference cites the repository at the commit its source pins, with the path
# and the section heading or the dashboard uid and panel id. The repository has no
# licence, so Kyumei links to it and reads an operator's own copy: none of its text
# or dashboards is copied here. Titles and headings are quoted only to cite them, and
# `why` is Kyumei's own account of the relevance.
#
# The repository has no tags or releases, so a reference records the version of
# what it cites where the repository declares one: a dashboard's version as its
# title gives it, and the dashboard version a playbook needs, from the playbooks
# index. Runbooks carry none.
#
# `kyumei knowledge verify --source temporal-server-operations-5a71c36=<checkout>`
# checks every title, section, panel and version at the pinned commit.

