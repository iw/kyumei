# Reviewed additions to generated SDK metric claims (generated/sdk-metrics.toml).
#
# The SDKs attach tags where a metric is recorded, so the generated claims have no labels.
# Each annotation below adds what a reviewer read at the recording sites of the Core, Go and
# Java SDKs: the label set, a gauge's unit, notes, and the provenance for them. Every metric
# a diagnostic signal reads needs a reviewed label set, because the validator checks the
# signal's label constraints against it.

[[annotation]]
claim = "sdk.worker_task_slots_available"
unit = "count"
labels = [
  { name = "worker_type", values = ["WorkflowWorker", "ActivityWorker", "LocalActivityWorker", "NexusWorker"], purpose = "Which kind of task the slots execute." },
  { name = "namespace" },
  { name = "task_queue", purpose = "Task Queue name (SDK label key; the server uses `taskqueue`)." },
]
notes = [
  "Slots reserved by an in-flight poll but not yet used count as available.",
  "Core omits the gauge when the slot supplier cannot report availability; the default fixed-size supplier reports it.",
  "The Java SDK publishes it only when the slot supplier has a maximum.",
]
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/telemetry/metrics.rs", line = 744, excerpt = "MetricKeyValue::new(KEY_WORKER_TYPE, \"WorkflowWorker\")" },
