[[annotation]]
claim = "sdk.workflow_task_schedule_to_start_latency"
labels = [
  { name = "namespace" },
  { name = "task_queue" },
  { name = "workflow_type", purpose = "The Go SDK sets it; the Java SDK sets it to `none` on this metric; Core does not set it." },
]
notes = [
  "Both timestamps are set by the server's History service, so the value includes any delay before the task reached Matching.",
  "Recorded only for tasks received by polling, not for Workflow Tasks returned inline on completion.",
  "Core's default buckets are 100, 500, 1000, 5000, 10000, 100000 and 1000000 ms, so quantiles between 10 s and 100 s are interpolated.",
  "The Java SDK records sticky-queue polls with `task_queue=\"<queue>:sticky\"`, so a filter on the Task Queue's name covers normal polls only.",
]
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/worker/workflow/wft_poller.rs", line = 221, excerpt = "if let Some(dur) = wft.sched_to_start() {" },
