# Temporal Server 1.31 diagnostic knowledge.
#
# Every claim in this pack records the exact versions it was verified
# against and where (repository, revision, path, line, verbatim excerpt).
# Claims marked unverified say why. Kyumei's own thresholds live in
# diagnostics/heuristics.toml and are never presented as Temporal behaviour.
#
# `kyumei knowledge verify` re-checks every excerpt against local checkouts.

[pack]
id = "temporal-1.31"
title = "Temporal Server 1.31 diagnostic knowledge"
version = "0.1.0"
server_family = "1.31"
verified_server_versions = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"]
# The version sweep generated every setting and metric of these releases; claims list the
# releases they hold in.
swept_server_versions = ["1.27.0", "1.27.1", "1.27.2", "1.27.3", "1.27.4", "1.28.0", "1.28.1", "1.28.2", "1.28.3", "1.28.4", "1.29.0", "1.29.1", "1.29.2", "1.29.3", "1.29.4", "1.29.5", "1.29.6", "1.29.7", "1.30.0", "1.30.1", "1.30.2", "1.30.3", "1.30.4", "1.30.5", "1.30.6", "1.30.7", "1.30.8", "1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"]
description = "Metrics, dynamic configuration, Task Queue API fields and behaviours of Temporal Server 1.31, and the settings and metrics of every release from 1.27.0, verified against source, with the SDKs that emit Worker metrics and Kyumei's diagnostics."
