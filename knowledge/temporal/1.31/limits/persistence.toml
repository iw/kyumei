[[statement]]
id = "behaviour.persistence-throttle-retries"
category = "behaviour"
title = "Where throttled persistence calls are retried"
statement = "The persistence layer does not retry a call a persistence limit refused. History's background tasks reschedule it, waiting at least 3 seconds and backing off by 1.5 times up to 5 minutes, and count it in task_errors_throttled. The Frontend's History client retries a System-scoped refusal once, after at least a second and only if the request's deadline allows, but not a Namespace-scoped one. Matching retries renewing a queue's task-ID lease and rewriting a task for up to 30 seconds, retries a refused backlog read every 3 seconds, and hands a refused write of a new task back to History, which retries it as above. Otherwise the API caller receives ResourceExhausted with cause PersistenceLimit."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
