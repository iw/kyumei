[[statement]]
id = "behaviour.persistence-priorities"
category = "behaviour"
title = "Persistence calls are admitted by priority"
statement = "The persistence limits admit calls by priority: operator calls first; then calls made for StartWorkflowExecution, SignalWorkflowExecution, SignalWithStartWorkflowExecution, RequestCancelWorkflowExecution, TerminateWorkflowExecution, UpdateWorkflowExecution and GetWorkflowExecutionHistory; then other API calls; then History's background tasks; and preemptable work last. As at the Frontend, an admitted call also takes a token from every lower priority, so heavy API traffic starves background work, never the reverse."
scope = { server = ["1.29.0", "1.29.1", "1.29.2", "1.29.3", "1.29.4", "1.29.5", "1.29.6", "1.29.7", "1.30.0", "1.30.1", "1.30.2", "1.30.3", "1.30.4", "1.30.5", "1.30.6", "1.30.7", "1.30.8", "1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
