[[statement]]
id = "behaviour.persistence-limit-order"
category = "behaviour"
title = "The order of persistence limits"
statement = "A persistence call is checked against the shard limit, then the namespace limit, then the host limit, and the first to refuse decides the error. So scope Namespace means a namespace or shard limit refused the call, and scope System the host limit."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
