[[statement]]
id = "limit.persistence-namespace-qps"
category = "limit"
title = "Namespace limits on persistence calls"
statement = "`*.persistenceNamespaceMaxQPS` limits one namespace's persistence calls on a host. At 0, the default, the namespace still gets its own bucket the size of the host limit. A `*.persistenceGlobalNamespaceMaxQPS` above 0 replaces it, divided like the host limit. History can also limit one namespace on one shard with `history.persistencePerShardNamespaceMaxQPS`, which at 0, the default, is the host limit. A call over a namespace or shard limit fails with ResourceExhausted, cause PersistenceLimit and scope Namespace."
notes = ["Calls the server makes for itself, not for a namespace, skip the namespace and shard limits."]
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
