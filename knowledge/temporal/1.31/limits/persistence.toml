[[statement]]
id = "behaviour.persistence-throttle-metrics"
category = "behaviour"
title = "How persistence calls and their failures are counted"
statement = "Every persistence call, including one a limit refused, is counted in persistence_requests and timed in persistence_latency, tagged with the operation and the namespace it was made for. A refused call is counted in persistence_errors_resource_exhausted with its cause and scope, not in persistence_errors. persistence_errors also leaves out timeouts, condition failures, NotFound, lost shard ownership and cancelled calls; persistence_error_with_type counts every error by type."
notes = ["When a refusal reaches an RPC, service_errors_resource_exhausted counts it again, with cause PersistenceLimit, on each service it passes through."]
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-03 }
