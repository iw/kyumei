# How Temporal Server limits its own persistence (database) calls in 1.31.0, read from source.
#
# Every service host has its own limiters, built once when the service starts and shared by
# all of its persistence managers. The settings named here are generated dynamic
# configuration claims.

[[statement]]
id = "limit.persistence-host-qps"
category = "limit"
title = "A server host's limit on its persistence calls"
statement = "Each server host limits its own persistence calls: History at `history.persistenceMaxQPS` (9,000/s by default), Matching at `matching.persistenceMaxQPS` (3,000/s), Frontend at `frontend.persistenceMaxQPS` (2,000/s) and the Worker service at `worker.persistenceMaxQPS` (500/s), with a burst of `system.persistenceQPSBurstRatio` (1) times that. A `*.persistenceGlobalMaxQPS` above 0 replaces it, divided among the service's hosts that are not draining or, for History, scaled by the share of shards the host owns. A call over the limit fails at once, without waiting, with ResourceExhausted, cause PersistenceLimit and scope System."
notes = [
  "The limiters exist only if the host limit is above 0 when the service starts. If it is 0 then, persistence calls are not limited at all.",
  "Visibility persistence has its own per-host read and write limits, `system.visibilityPersistenceMaxReadQPS` and `system.visibilityPersistenceMaxWriteQPS` (9,000/s each), and refuses with the same error.",
]
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-03 }
