[[statement]]
id = "behaviour.sql-pool-wait"
category = "behaviour"
title = "A full SQL connection pool makes persistence calls wait"
statement = "When a SQL datastore's pool already has its `maxConns` connections open and none is free, a persistence call waits for one until its context ends. Go's database/sql counts these waits, but the server does not publish the count: a full pool shows only as persistence_sql_in_use reaching persistence_sql_max_open_conn, and in persistence_latency, whose timer spans the call down to the datastore."
notes = ["The pool gauges are sampled once a minute, so a pool that fills briefly between samples can go unseen."]
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-03 }
