[[statement]]
id = "limit.sql-connection-pool"
category = "limit"
title = "A SQL datastore's connection pool"
statement = "With MySQL or PostgreSQL, each server host keeps a connection pool per datastore, capped by the datastore's `maxConns` setting; when that is not set, or 0, the pool has no cap. SQLite always uses one connection. For MySQL and PostgreSQL, every minute each host reports the pool: persistence_sql_max_open_conn (the cap, 0 when there is none), persistence_sql_open_conn, persistence_sql_in_use and persistence_sql_idle_conn, tagged db_kind `main` or `visibility`. SQLite's pool is not reported."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
