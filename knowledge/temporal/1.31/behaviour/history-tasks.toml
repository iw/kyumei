[[statement]]
id = "behaviour.history-task-latencies"
category = "behaviour"
title = "What each History task latency measures"
statement = "task_latency_load runs from a task's creation, or for a timer from its fire time, to its loading into memory; task_latency_schedule, from loading or a retry to an attempt starting on a scheduler worker; task_latency_processing, one attempt's execution; and task_latency_queue, from creation or fire time to completion, across every attempt. For a timer, task_latency_queue is how late it completed after it was due to fire."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-13 }
provenance = [
  { source = ["temporal-server-v1.31.0", "temporal-server-v1.31.1", "temporal-server-v1.31.2", "temporal-server-v1.31.3", "temporal-server-v1.31.4"], path = "service/history/queues/executable.go", line = 221, excerpt = "loadTime := util.MaxTime(timeSource.Now(), task.GetKey().FireTime)" },
