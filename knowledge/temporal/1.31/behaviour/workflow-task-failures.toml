[[statement]]
id = "sdk.wft-failure-reported-once"
category = "behaviour"
title = "SDKs report only a Workflow Task's first failed attempt"
statement = "Core, the Go SDK and the Java SDK send RespondWorkflowTaskFailed only for a Workflow Task's first attempt. When a later attempt fails, the Worker sends nothing and History learns of it when the attempt's start-to-close timeout fires. During a run of failures, History's failed_workflow_tasks therefore rises about once per Workflow, while start_to_close_timeout with operation TimerActiveTaskWorkflowTaskTimeout counts the retries."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"], sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }, { family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-13 }
provenance = [
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/worker/workflow/managed_run.rs", line = 638, excerpt = "| EvictionRequestResult::EvictionAlreadyRequested(Some(attempt)) => *attempt <= 1," },
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/worker/workflow/managed_run.rs", line = 684, excerpt = "ActivationCompleteOutcome::WFTFailedDontReport" },
  { source = "sdk-core-acac9e3f", path = "crates/sdk-core/src/worker/workflow/mod.rs", line = 1256, excerpt = "/// The workflow task failed, but we shouldn't report it. EX: We have failed 2 or more attempts" },
  { source = "sdk-go-v1.44.0", path = "internal/internal_task_pollers.go", line = 717, excerpt = "// Only fail workflow task on first attempt, subsequent failure on the same workflow task will timeout." },
  { source = "sdk-go-v1.44.0", path = "internal/internal_task_pollers.go", line = 719, excerpt = "if task.GetAttempt() == 1 {" },
  { source = "sdk-java-v1.40.0", path = "temporal-sdk/src/main/java/io/temporal/internal/replay/ReplayWorkflowTaskHandler.java", line = 313, excerpt = "// Only fail workflow task on the first attempt, subsequent failures of the same workflow task" },
  { source = "sdk-java-v1.40.0", path = "temporal-sdk/src/main/java/io/temporal/internal/replay/ReplayWorkflowTaskHandler.java", line = 316, excerpt = "if (workflowTask.getAttempt() > 1) {" },
  { source = ["temporal-server-v1.31.0", "temporal-server-v1.31.1", "temporal-server-v1.31.2", "temporal-server-v1.31.3", "temporal-server-v1.31.4"], path = "service/history/timer_queue_active_task_executor.go", line = 419, excerpt = "operationMetricsTag = metrics.TimerActiveTaskWorkflowTaskTimeoutScope" },
