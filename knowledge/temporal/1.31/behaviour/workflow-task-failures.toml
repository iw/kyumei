# How Workflow Tasks fail, how History retries them, and what the SDKs report,
# in Temporal Server 1.31.0, Core, Go SDK v1.44.0 and Java SDK v1.40.0.

[[statement]]
id = "behaviour.wft-retried-without-limit"
category = "behaviour"
title = "A failing Workflow Task is retried without limit"
statement = "History retries a Workflow Task that fails or times out until an attempt completes or the Workflow closes, and schedules each next attempt at once. Each failure or start-to-close timeout raises the attempt by one, except for a task that ran on a Worker's sticky queue: History clears the sticky queue, and the next attempt, on the normal queue, is attempt 1 again. From the fourth attempt, the attempt's start-to-close timeout is the Workflow Task timeout plus a backoff that starts at 5 seconds and doubles each attempt, up to history.workflowTaskRetryMaxInterval (10 minutes by default)."
notes = [
  "history.workflowTaskCriticalAttempt (10 by default) only logs a throttled warning; no setting stops the retries.",
  "A schedule-to-start timeout, which only a sticky queue or a speculative task for a Workflow Update has, does not count as an attempt.",
]
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
