[[statement]]
id = "behaviour.wft-retries-leave-no-events"
category = "behaviour"
title = "Retries of a failed Workflow Task leave no history events"
statement = "History writes a Workflow Task's failed attempt to the Workflow's history, as WorkflowTaskFailed or WorkflowTaskTimedOut, only while its attempt is 1, and writes no events for later attempts until one completes. A task that fails on a Worker's sticky queue stays at attempt 1 and is retried on the normal queue, so that retry's failure is written too. A Workflow stuck in retries therefore shows one failure in its history, or two when the first failure was on a sticky queue; DescribeWorkflowExecution reports the current attempt as pendingWorkflowTask.attempt."
notes = ["A new event, such as a Signal, ends the run: the next attempt is numbered 1 again and its failure is written to history."]
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-15 }
provenance = [
