title = "SDKs count every failed Workflow Task attempt"
statement = "Core, the Go SDK and the Java SDK increment workflow_task_execution_failed for every failed Workflow Task attempt, whether or not they report it, tagged failure_reason: NonDeterminismError when the cause is a nondeterminism error, and WorkflowError for other failures of Workflow code."
notes = ["A completion too large to send is counted as GrpcMessageTooLarge, RequestTooLarge or PayloadsTooLarge, depending on the SDK."]
scope = { sdk = [{ family = "core", revision = "sdk-rust acac9e3f" }, { family = "go", revision = "sdk-go v1.44.0" }, { family = "java", revision = "sdk-java v1.40.0" }] }
