# History's host-level Workflow (mutable state) cache in Temporal Server
# 1.31.0: its size, what a miss costs, and what fills it.

[[statement]]
id = "behaviour.mutable-state-cache"
category = "behaviour"
title = "History caches Workflow state per host, and a miss reads the database"
statement = "History keeps the state of Workflows it has loaded in one cache per host, of history.hostLevelCacheMaxSize entries (128,000 by default, read when the host starts). A request or task whose Workflow is not cached counts a cache miss and reads the Workflow's state from the database with GetWorkflowExecution. A full cache evicts the least recently used Workflow that nothing is using; if every entry is in use, the request fails with ResourceExhausted, \"cache capacity is fully occupied with pinned elements\"."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-13 }
