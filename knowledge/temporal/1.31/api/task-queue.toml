# How to call DescribeTaskQueue without the CLI.

[[statement]]
id = "behaviour.frontend-grpc-reflection"
category = "behaviour"
title = "The Frontend serves gRPC reflection"
statement = "The Frontend registers the gRPC reflection service on its gRPC server when it starts, so gRPC clients that use reflection, such as grpcurl, can call WorkflowService methods such as DescribeTaskQueue without the API's proto files."
scope = { server = ["1.31.0", "1.31.1", "1.31.2", "1.31.3", "1.31.4"] }
verification = { status = "verified", method = "source-inspection", on = 2026-10-19 }
provenance = [
  { source = ["temporal-server-v1.31.0", "temporal-server-v1.31.1", "temporal-server-v1.31.2", "temporal-server-v1.31.3", "temporal-server-v1.31.4"], path = "service/frontend/service.go", line = 469, excerpt = "reflection.Register(s.server)" },
]
