  { source = ["temporal-cli-v1.7.0", "temporal-cli-v1.7.1", "temporal-cli-v1.7.2", "temporal-cli-v1.7.3", "temporal-cli-v1.8.0", "temporal-cli-v1.8.1", "temporal-cli-v1.8.2", "temporal-cli-v1.8.3", "temporal-cli-v1.9.0", "temporal-cli-v1.9.1"], path = "internal/printer/printer.go", line = 281, excerpt = 'return json.MarshalIndent(v, "", indent)' },
