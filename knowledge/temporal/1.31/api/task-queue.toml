[[statement]]
id = "cli.task-queue-describe"
category = "cli-command"
title = "temporal task-queue describe"
statement = "Temporal CLI 1.7.0 to 1.9.1 describe a Task Queue through the Go SDK's DescribeTaskQueueEnhanced and print rows of their own, not DescribeTaskQueue's response. With `-o json`, `stats` lists a row per Build ID and Task Queue type, with approximateBacklogCount, approximateBacklogAge, tasksAddRate and tasksDispatchRate, and `pollers` lists the Workers that polled, a row each with its Build ID and type. No flag makes them print the effective rate limit or its source."
notes = [
  "The Go SDK 1.41.1, which CLI 1.7.0 to 1.8.3 build with, asks for DescribeTaskQueue's enhanced mode, in which the server returns versionsInfo alone, without effectiveRateLimit (behaviour.describe-task-queue-rate-limit).",
  "`--report-config` takes effect only with `--legacy-mode`, whose JSON lists each partition's status, pollers and configuration, without the effective rate limit. `temporal task-queue config get` prints only the queue rate limit set through the API.",
  "Without `--task-queue-type` the Frontend describes the Workflow and the Activity Task Queue, a row for each.",
  "Without a `--select-*` flag the CLI describes the Task Queue's default Build ID only: the unversioned queue, unless versioning rules name a default. DescribeTaskQueue's default mode merges the statistics of every version and lists the pollers of every loaded version.",
  "The CLI writes its rows with Go's encoding/json: approximateBacklogCount is a number, no pollers is `null`, and approximateBacklogAge is a Go duration with a space after each letter and whole days as `d`, such as `4m 39.240305s`, `450m s` (milliseconds) or `3d 0h 5m 2s`.",
  "backlogIncreaseRate is not a DescribeTaskQueue field: the CLI prints the Go SDK's, which SDK 1.41.1 computes as TasksAddRate minus TasksDispatchRate.",
]
verification = { status = "verified", method = "source-inspection", on = 2026-10-19 }
provenance = [
  { source = ["temporal-cli-v1.7.0", "temporal-cli-v1.7.1", "temporal-cli-v1.7.2", "temporal-cli-v1.7.3", "temporal-cli-v1.8.0", "temporal-cli-v1.8.1", "temporal-cli-v1.8.2", "temporal-cli-v1.8.3", "temporal-cli-v1.9.0", "temporal-cli-v1.9.1"], path = "internal/temporalcli/commands.taskqueue.go", line = 290, excerpt = "resp, err := cl.DescribeTaskQueueEnhanced(cctx, client.DescribeTaskQueueEnhancedOptions{" },
