[[statement]]
id = "cli.workflow-show"
category = "cli-command"
title = "temporal workflow show"
statement = "Temporal CLI 1.7.0 to 1.9.1 print a Workflow Execution's event history with `temporal workflow show --output json` as the API's History JSON, `{\"events\": [...]}`, oldest event first, with payload shorthand turned off so that the SDKs' replayers read it."
notes = [
  "The CLI fetches every page of the history before printing, so the JSON is as large as the history; `jq '.events[-1]'` keeps the last event.",
]
