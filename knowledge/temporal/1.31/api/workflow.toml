[[statement]]
id = "cli.workflow-describe"
category = "cli-command"
title = "temporal workflow describe"
statement = "Temporal CLI 1.7.0 to 1.9.1 describe a Workflow Execution with DescribeWorkflowExecution and, with `-o json`, print the response as the API's own JSON: lowerCamelCase field names, enums by name and 64-bit integers as strings. For a Workflow that is no longer running they add `closeEvent`, its close event, and for one that completed, `result`."
notes = [
  "`workflowExecutionInfo` carries `status`, `historyLength` and `historySizeBytes`, and a running Workflow's `pendingWorkflowTask` its `attempt`.",
  "The CLI fetches the close event alone, with the close-event history filter, so for a terminated Workflow `closeEvent` holds the WorkflowExecutionTerminated event and its reason without the rest of the history.",
  "The JSON encoder is go.temporal.io/api's, as in 1.62.8.",
]
