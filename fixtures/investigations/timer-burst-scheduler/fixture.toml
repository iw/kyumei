# Reference fixture for History task processing lag.
#
# A nightly batch sets about 2 million reminder timers to fire at 09:00 UTC
# exactly. At 09:00 every History shard's timer queue fills to its cap of
# 10,000 pending tasks, the readers pause, and the host schedulers' 512
# workers are all busy. Each attempt stays fast, about 30 ms, but timers
# complete up to a minute and a half late, and Activities scheduled at the
# same time wait behind them.
#
# The investigation must find the delay in loading and in the scheduler,
# rule out slow attempts and every kind of retry, and conclude that the hosts
# had more tasks than their workers get through.

[fixture]
id = "timer-burst-scheduler"
title = "Two million timers at 09:00: History's schedulers saturated, timers 90 s late"
description = "Reference fixture for History task processing lag. Four evidence submissions locate the delay along the task path and rule out the deeper causes."
investigation = "inv-golden-history-task-lag"

[open]
at = 2026-10-13T09:20:00Z
description = "Timers in namespace reminders have been firing 30 to 90 seconds late since 09:00 UTC. A nightly batch set about 2 million reminder timers to fire at 09:00 exactly."
server_version = "1.31.0"
namespaces = ["reminders"]
window_start = 2026-10-13T09:00:00Z
window_end = 2026-10-13T09:30:00Z

[open.topology]
deployment = "self_hosted_kubernetes"
frontend_hosts = 3
history_hosts = 4
matching_hosts = 3
persistence = "PostgreSQL 16"

[open.expect]
next_request = "task-load-latency"
conclusion = "none"
concluded = false

[open.expect.states]
load-lag = "candidate"
scheduler-backlog = "candidate"
slow-processing = "candidate"
persistence-throttled = "candidate"
busy-workflow = "candidate"
task-errors = "candidate"

# E1 — Load latency by task type.
[[step]]
at = 2026-10-13T09:24:00Z
answers = "task-load-latency"
file = "evidence/e1-load-latency.json"
channel = "paste"
query = 'histogram_quantile(0.99, sum by (le, task_type) (rate(task_latency_load_bucket{namespace="reminders"}[1m])))'

[step.expect]
next_request = "task-schedule-latency"
findings = ["F-load-delayed"]
bound_signals = ["task_load_latency"]
conclusion = "tasks-late"
concluded = false

[step.expect.states]
load-lag = "established"

# E2 — Scheduler wait by task type.
[[step]]
at = 2026-10-13T09:26:00Z
answers = "task-schedule-latency"
file = "evidence/e2-schedule-latency.json"
channel = "paste"
query = 'histogram_quantile(0.99, sum by (le, task_type) (rate(task_latency_schedule_bucket{namespace="reminders"}[1m])))'

[step.expect]
next_request = "task-processing-latency"
findings = ["F-schedule-delayed"]
bound_signals = ["task_schedule_latency"]
conclusion = "tasks-late"
concluded = false

[step.expect.states]
scheduler-backlog = "established"

# E3 — Attempt latency by task type.
[[step]]
at = 2026-10-13T09:28:00Z
answers = "task-processing-latency"
file = "evidence/e3-processing-latency.json"
channel = "paste"
query = 'histogram_quantile(0.99, sum by (le, task_type) (rate(task_latency_processing_bucket{namespace="reminders"}[1m])))'

[step.expect]
next_request = "task-errors"
findings = ["F-attempts-fast"]
bound_signals = ["task_processing_latency"]
conclusion = "scheduler-saturated"
concluded = false

[step.expect.states]
slow-processing = "eliminated"

# E4 — Failed attempts by cause (a Grafana CSV export with both queries).
[[step]]
at = 2026-10-13T09:31:00Z
answers = "task-errors"
file = "evidence/e4-task-errors.csv"
channel = "upload"
query = 'sum by (resource_exhausted_cause) (rate(task_errors_throttled{namespace="reminders"}[1m])) and sum(rate(task_errors{namespace="reminders"}[1m]))'

[step.expect]
next_request = "none"
findings = ["F-no-busy-workflows", "F-no-persistence-refusals", "F-no-errors"]
bound_signals = ["busy_workflow_retries", "persistence_throttled_retries", "task_error_rate"]
conclusion = "scheduler-saturated"
concluded = true

[step.expect.states]
load-lag = "established"
scheduler-backlog = "established"
slow-processing = "eliminated"
persistence-throttled = "eliminated"
busy-workflow = "eliminated"
task-errors = "eliminated"
