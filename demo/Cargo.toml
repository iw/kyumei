[package]
name = "kyumei-demo"
version = "0.1.0"
description = "Synthetic incidents for a Kyumei demo, on Temporal's Rust SDK"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# The SDK's macros expand to code that names futures and temporalio-workflow.
futures = "0.3.34"
gethostname = "1.1.0"
# Plain HTTP to the Frontend on this machine, so no TLS.
reqwest = { version = "0.12.28", default-features = false }
serde_json = "1.0.151"
temporalio-client = "1.0.0"
temporalio-common = "1.0.0"
temporalio-macros = "1.0.0"
temporalio-sdk = "1.0.0"
temporalio-workflow = "1.0.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints.rust]
unsafe_code = "forbid"

# A workspace of its own, which Kyumei's builds and CI leave out.
[workspace]
